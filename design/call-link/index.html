<style>

input { font: inherit; color: inherit; background: none; border: 0; outline: 0; }
#root { display: flex; height: 100%; }
#stage { flex: 1; position: relative; overflow: hidden; }
.shot #picker { display: none; }

/* ---------- picker (outside the app) ---------- */
#picker { width: 380px; flex: none; border-left: 1px solid #222; background: #111113; overflow-y: auto; padding: 18px 18px 84px; }
#picker h1 { font-size: 15px; font-weight: 650; color: #f2f2f4; margin: 0; }

.pk-btn { padding: 5px 9px; border-radius: 7px; background: #1b1b1f; color: #b4b4bb; font-size: 12px; border: 1px solid #26262b; }
.pk-btn:hover { background: #222227; color: #eee; }
.pk-btn.on { background: #ececf0; color: #111; border-color: #ececf0; }
.pk-scenes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.pk-notes { padding: 10px 12px; border-radius: 9px; background: #17171a; border: 1px solid #222226; color: #a6a6ae; font-size: 12px; }
.pk-notes ul { margin: 0; padding-left: 15px; }
.pk-ba { display: flex; gap: 4px; align-items: center; margin-bottom: 10px; }
.pk-ba span { color: #6c6c74; font-size: 11px; margin-left: 4px; }
.pk-tog { display: flex; gap: 8px; align-items: center; color: #a6a6ae; font-size: 12px; margin-top: 6px; }
.pk-tog i { width: 24px; height: 14px; border-radius: 7px; background: #2a2a30; position: relative; flex: none; }
.pk-tog i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 10px; height: 10px; border-radius: 50%; background: #8a8a92; transition: transform .15s; }
.pk-tog.on i { background: #ececf0; } .pk-tog.on i::after { transform: translateX(10px); background: #111; }
.pk-audit { margin-top: 8px; color: #8a8a92; font-size: 11.5px; }
.pk-audit b { color: #eee; }
.pk-dec { margin-bottom: 14px; }
.pk-dec > b { color: #f2f2f4; font-size: 12.5px; }
.pk-dec p { color: #8a8a92; font-size: 12px; margin: 3px 0 6px; }
.pk-new { color: #a6a6ae; font-size: 12px; margin: 3px 0 6px; }
.pk-new q { color: #e6e6ea; }
.pk-opt { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 8px; border-radius: 7px; color: #b4b4bb; font-size: 12px; }
.pk-opt:hover { background: #1b1b1f; color: #eee; }
.pk-opt.on { color: #f4f4f6; background: #1d1d22; }
.pk-opt .r { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #4a4a52; flex: none; }
.pk-opt.on .r { border-color: #f4f4f6; background: radial-gradient(#f4f4f6 0 2.5px, transparent 3px); }
.pk-opt .end { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.pk-opt .rec, .pk-opt .lk { font-size: 10.5px; color: #6c6c74; }
.pk-opt .hq { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #3a3a42; color: #8a8a92; font-size: 10px; display: inline-grid; place-items: center; position: relative; }
.pk-opt .hq:hover::after { content: attr(data-help); position: absolute; right: -4px; top: 22px; width: 270px; padding: 8px 10px; border-radius: 8px; background: #26262c; border: 1px solid #3a3a42; color: #e6e6ea; font-size: 11.5px; line-height: 1.45; white-space: normal; z-index: 10; }
.pk-lock { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 3px 0; color: #8a8a92; }
.pk-lock b { font-weight: 500; color: #c4c4cb; }
.pk-foot { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 22px; }
/* Agentation toolbar: bottom right of the app, not over the picker. */
.agt-host { right: 396px !important; bottom: 16px !important; }
#picker .read { color: #a6a6ae; font-size: 12px; margin: -6px 0 14px; padding-left: 10px; border-left: 2px solid #2a2a30; }
#picks { margin-top: 10px; width: 100%; height: 150px; background: #141417; color: #bdbdc4; border: 1px solid #25252a; border-radius: 8px; padding: 8px; font: 11px/1.45 ui-monospace, Menlo, monospace; resize: vertical; }

/* ---------- preview: crossfade, short glow, alignment guides ---------- */
.ghost { pointer-events: none; z-index: 140; transition: opacity 140ms ease; }
.pvhl { animation: pvpulse 900ms ease-out forwards; }
@keyframes pvpulse { 0% { box-shadow: 0 0 0 0 rgba(90,160,255,.9), 0 0 0 1.5px rgba(90,160,255,.9); } 60% { box-shadow: 0 0 0 8px rgba(90,160,255,0), 0 0 0 1.5px rgba(90,160,255,.9); } 100% { box-shadow: 0 0 0 8px rgba(90,160,255,0), 0 0 0 1.5px transparent; } }
#guides { position: absolute; inset: 0; pointer-events: none; z-index: 150; }
#guides .gv { position: absolute; width: 0; border-left: 1px solid rgba(64, 214, 120, .55); }
#guides .gv.r { border-left-color: rgba(90, 160, 255, .55); }
#guides .gv span { position: absolute; top: 2px; left: 2px; font: 9px ui-monospace, Menlo, monospace; color: rgba(64, 214, 120, .95); background: rgba(0,0,0,.6); padding: 0 2px; }
#guides .bx { position: absolute; outline: 1px solid rgba(255, 70, 90, .95); background: rgba(255, 70, 90, .12); }
#guides .bx span { position: absolute; top: -12px; left: 0; font: 9px ui-monospace, Menlo, monospace; color: #fff; background: rgba(220, 40, 60, .9); padding: 0 3px; white-space: nowrap; }
#guides .ol { position: absolute; outline: 1px dashed rgba(255, 255, 255, .14); }
#guides .legend { position: absolute; left: 12px; bottom: 12px; padding: 8px 10px; border-radius: 8px; background: rgba(10,10,12,.88); border: 1px solid rgba(255,255,255,.12); font: 11px/1.5 -apple-system, system-ui; color: #ddd; }

/* ================= the app: the right column of Horion (current look, Theme.swift tokens) ================= */
/* Only what this round is about: the 320 pt right column, as the event editor and as Today. Geist, 12 / 11 pt, radius 5 · 9 · 13. */
@font-face { font-family: "Geist"; src: url(fonts/geist-latin.woff2) format("woff2"); font-weight: 100 900; font-display: block; }
#stage { display: grid; place-items: center; background: #050507; }
.desk { --sans: "Geist", system-ui, sans-serif; --r-s: 5px; --r-c: 9px; --r-srf: 13px; --r-mark: 4px;
  --t1: 120ms; --ease: cubic-bezier(.22, .61, .36, 1); }
.desk.theme-ink { --bg: #0B0B0C; --bg1: #151516; --bg2: #1D1D1E; --bg3: #2A2A2C; --fg: #EBEBED; --fg2: #CCCCCE; --fg3: #A8A8AA; --fg4: #4E4E50;
  --hair: #1C1C1D; --hair2: #2A2A2C; --hover: #161617; --rail: #121213; --live: #FF6B5F; --danger: #FF7B72; --pop: #0B0B0C; --popedge: #2A2A2C;
  --shadow: 0 12px 32px rgba(0,0,0,.55); color-scheme: dark; }
.desk.theme-paper { --bg: #FBFBFB; --bg1: #F1F1F2; --bg2: #FFFFFF; --bg3: #DCDCDC; --fg: #1D1D20; --fg2: #4A4A50; --fg3: #606067; --fg4: #B8B8B9;
  --hair: #E8E8E8; --hair2: #DCDCDC; --hover: #F1F1F1; --rail: #EAEAEB; --live: #C9372C; --danger: #B4382D; --pop: #FBFBFB; --popedge: #DCDCDC;
  --shadow: 0 12px 32px rgba(20,20,30,.14); color-scheme: light; }
.desk { --act: var(--fg); --on-act: var(--bg); --acth: color-mix(in srgb, var(--fg) 88%, var(--bg)); }
.desk { position: absolute; left: 50%; top: 50%; transform-origin: 50% 50%; overflow: hidden; background: var(--bg); color: var(--fg);
  font: 400 12px/18px var(--sans); letter-spacing: -.005em; -webkit-font-smoothing: antialiased; border-radius: 12px; box-shadow: 0 0 0 1px var(--hair2); }
.col { position: absolute; inset: 0; }
svg { display: block; flex: none; }
.dim { color: var(--fg3); } .num { font-variant-numeric: tabular-nums; }
.srch { margin: 10px 12px 6px; height: 28px; border-radius: var(--r-c); background: var(--bg2); display: flex; align-items: center; gap: 8px; padding: 0 6px 0 10px; color: var(--fg3); }
.srch .sp { flex: 1; } .cap { min-width: 16px; height: 16px; padding: 0 4px; border-radius: var(--r-mark); box-shadow: inset 0 0 0 1px var(--hair2); font-size: 11px; display: inline-grid; place-items: center; color: var(--fg3); }

/* event editor */
.ed { padding: 6px 14px 20px 20px; }
.ed__top { display: flex; align-items: center; gap: 4px; height: 36px; }
.ed__top::before { content: ""; width: 3px; height: 18px; border-radius: 2px; background: var(--c); margin-right: 13px; }
.ed__t { flex: 1; font: 600 15px/21px var(--sans); letter-spacing: -.015em; }
.ib { width: 26px; height: 26px; border-radius: var(--r-s); display: grid; place-items: center; color: var(--fg2); position: relative; flex: none; }
.ib:hover { background: var(--rail); color: var(--fg); }
.ib.sm { width: 22px; height: 22px; color: var(--fg3); } .ib.sm svg { width: 14px; height: 14px; }
.ib.sm:hover { color: var(--fg); }
.ib.danger:hover { color: var(--danger); }
.fl { display: grid; grid-template-columns: 16px minmax(0, 1fr); column-gap: 12px; row-gap: 8px; margin-top: 8px; }
.fl__k { height: 32px; display: grid; place-items: center; color: var(--fg2); }
.fl__v { min-width: 0; min-height: 32px; display: flex; flex-direction: column; justify-content: center; }
.fl__v.h { flex-direction: row; align-items: center; justify-content: flex-start; gap: 10px; }
.sub { color: var(--fg3); font-size: 11px; line-height: 14px; }
.seg { display: inline-flex; padding: 2px; border-radius: var(--r-c); background: var(--bg1); }
.seg b { font-weight: 500; padding: 0 12px; height: 24px; line-height: 24px; border-radius: 7px; color: var(--fg3); }
.seg b.on { background: var(--bg2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--hair2); }
.av { display: flex; align-items: center; gap: 8px; height: 26px; } .av i { width: 14px; text-align: center; font-style: normal; color: #6CC58A; }

/* the call row: subject of this round */
.cr { display: flex; align-items: center; gap: 2px; min-width: 0; height: 32px; position: relative; }
.cr .lk { flex: 1; min-width: 0; height: 26px; display: flex; align-items: center; gap: 7px; padding: 0 6px; margin-left: -6px; border-radius: var(--r-s); white-space: nowrap; cursor: text; color: var(--fg); }
.cr .lk span { overflow: hidden; text-overflow: ellipsis; }
.cr .lk:hover { box-shadow: inset 0 0 0 1px var(--hair2); }
.cr .lk.ro { cursor: pointer; } .cr .lk.ro:hover { box-shadow: none; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--fg) 40%, transparent); text-underline-offset: 3px; }
.cr .lk.sm { color: var(--fg2); font-size: 11px; }
.cr input { flex: 1; min-width: 0; height: 26px; margin-left: -6px; padding: 0 6px; border-radius: var(--r-s); background: var(--bg1); box-shadow: inset 0 0 0 1px var(--fg4), 0 0 0 2px color-mix(in srgb, #6E9BF5 45%, transparent); font-size: 12px; }
.cr .acts { display: flex; gap: 0; margin-right: -4px; }
.cr .acts.hov .ib { opacity: 0; transition: opacity var(--t1); } .cr:hover .acts.hov .ib, .cr .acts.hov .ib.keep { opacity: 1; }
.tip::after { content: attr(data-tip); position: absolute; right: -2px; bottom: calc(100% + 6px); padding: 0 7px; height: 20px; line-height: 20px; border-radius: var(--r-s); white-space: nowrap;
  font: 500 11px/20px var(--sans); color: var(--fg); background: var(--bg2); box-shadow: 0 0 0 1px var(--hair2), 0 4px 12px rgba(0,0,0,.25);
  opacity: 0; transform: translateY(2px); pointer-events: none; transition: opacity 120ms, transform 120ms; z-index: 5; }
.tip:hover::after, .tip.ok::after { opacity: 1; transform: none; transition-delay: 250ms; } .tip.ok::after { transition-delay: 0s; }
.tip.ok { color: var(--fg); }

/* Join: the filled ink button with the ⌘ J keycaps */
.join { width: 100%; height: 32px; border-radius: var(--r-c); background: var(--act); color: var(--on-act); display: flex; align-items: center; gap: 7px;
  font-weight: 600; font-size: 12px; padding: 0 10px; transition: background var(--t1); }
.join:hover { background: var(--acth); }
.join.c { justify-content: center; } .join.l .jt { flex: 1; }
.join.card { height: 30px; }
.kb { display: inline-flex; gap: 3px; margin-left: 2px; }
.kb kbd { font: 500 11px/1 var(--sans); min-width: 18px; height: 18px; padding: 0 4px; border-radius: var(--r-mark); display: inline-grid; place-items: center; background: color-mix(in srgb, var(--on-act) 16%, transparent); color: var(--on-act); }
.lg { width: 15px; height: auto; }

/* add a call: the menu */
.addc { height: 26px; display: flex; align-items: center; color: var(--fg3); padding: 0 6px; margin-left: -6px; border-radius: var(--r-s); width: 100%; }
.addc:hover, .addc.on { background: var(--rail); color: var(--fg2); }
.menu { position: absolute; z-index: 20; width: 260px; padding: 6px; border-radius: var(--r-srf); background: var(--pop); box-shadow: 0 0 0 1px var(--popedge), var(--shadow); }
.mi { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 30px; padding: 5px 8px; border-radius: 7px; }
.mi:hover { background: var(--hover); }
.mi .s2 { display: block; color: var(--fg3); font-size: 11px; line-height: 14px; }
.mi.danger { color: var(--danger); }
.sep { height: 1px; background: var(--hair); margin: 5px 4px; }
.made { height: 32px; border-radius: var(--r-c); background: var(--bg2); display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--fg2); }

/* today: the lead card */
.cd { margin: 2px 20px 6px; padding: 10px 0 17px; border-bottom: 1px solid var(--hair); }
.cd__k { display: flex; gap: 8px; height: 18px; align-items: center; font-size: 11px; font-weight: 500; color: var(--fg3); }
.cd__k b { font-weight: 500; color: var(--fg2); } .cd__k b.live { color: var(--live); }
.cd__r { display: flex; gap: 8px; margin-top: 6px; text-align: left; }
.cd__tm { width: 36px; text-align: right; font-size: 11px; line-height: 14px; padding-top: 3px; color: var(--fg2); } .cd__tm span { display: block; color: var(--fg3); }
.cd__bar { width: 7px; display: flex; justify-content: center; } .cd__bar i { width: 3px; border-radius: 2px; background: var(--c); margin: 2px 0; }
.cd__t { font-weight: 600; line-height: 20px; } .cd__m { font-size: 11px; line-height: 14px; color: var(--fg2); }
.cd__j { display: flex; align-items: center; gap: 4px; margin-top: 12px; }
.cd__j > .ib { margin-right: -4px; }
.lt { padding: 12px 20px 0; } .lt__k { font-size: 11px; font-weight: 500; color: var(--fg3); height: 18px; margin-bottom: 4px; }
.lt__r { display: flex; align-items: center; gap: 8px; height: 26px; } .lt__r .num { width: 36px; text-align: right; font-size: 11px; color: var(--fg2); }
.lt__r i { width: 3px; height: 14px; border-radius: 2px; background: var(--c); margin: 0 2px; }

.to { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); height: 32px; padding: 0 14px; border-radius: 16px; display: flex; align-items: center;
  font-size: 12px; white-space: nowrap; background: var(--bg2); box-shadow: 0 0 0 1px var(--hair2), var(--shadow); }
</style>
</head>

<script>
// ================= edit for each round =================
const PRODUCT = 'Horion call link', VERSION = 'v1', ROUND = 4;
const DESK = { w: 320, h: 470 };            // the right column (320 pt), cut to the part that matters
const SCENES = [['event', 'Event with Google Meet'], ['zoom', 'Zoom, long link'], ['edit', 'Editing the link'], ['nocall', 'No call yet'],
  ['menu', 'Add a call: the menu'], ['made', 'Meet link made on save'], ['today', 'Up next is a call'], ['live', 'Call running now'],
  ['paper-event', 'Event, Paper'], ['paper-today', 'Up next, Paper']];
const HOWTO = ['Everything is clickable: click the link to edit it (Return keeps it), Copy copies, ✕ removes the call, Add conferencing opens the menu.', 'This is the current Horion look (Geist, the app\'s colours), 320 pt right column, enlarged.', 'Keys: G alignment guides, ⌘J joins.', 'Notes on one element: turn on Agentation below, click the element, write. "Copy my picks" takes the notes.'];
const READ = 'Reading this as: the call row should read like every other row (icon, then the value), with Join as the one strong thing under it; edit, copy and remove live with the link. Dials: variance 2, motion 3, density 5.';
const LOCKED = { add: 'menu', tool: 'btn', btn: 'fill', key: 'cmdj', copy: 'tip', fb: 'check', row: 'linktop', acts: 'icons', jalign: 'center', card: 'full' };
const BEFORE = { row: 'jointop', acts: 'hoverx', jalign: 'center', card: 'title' };
const DECISIONS = [
  { g: 'Round 4', id: 'row', name: 'The call row in the event', fb: 'go to something earlier where the link is actually there in the row with the camera icon and under it is the Join button … then you can also remove the link there and edit the link',
    note: 'Look at the event. B switches to how the app is now.', scene: 'event', hl: '.cr, .join', opts: [
    ['linktop', 'Link on the camera row, Join under it', 'The camera row holds the link like any other value (12 pt, fg), with its actions on the right. The wide Join sits under it in the value column.'],
    ['jointop', 'Join on the camera row, link under it', 'As in the app now: Join takes the camera row, the link follows small in grey.'],
  ] },
  { id: 'acts', name: 'Edit, copy and remove the link', fb: 'the x being there is actually a good idea i think it just wasnt visible … there is no good way currently to remove it',
    note: 'Hover the link row. Click the link, Copy and ✕.', scene: 'event', hl: '.cr .acts, .cr .lk', opts: [
    ['icons', 'Click the link to edit; Copy and ✕ always shown', 'Both icons stay on the right in fg3, with tips ("Copy link", "Remove call"). The link gets a field edge on hover and becomes a text field on click.'],
    ['hoverx', 'Click to edit; Copy always, ✕ on hover', 'Copy stays; ✕ fades in left of it while the pointer is on the row. Its space is always kept, so nothing shifts.'],
    ['more', 'Link opens the call; Copy and a ⋯ menu', 'Clicking the link joins, like a link. The ⋯ menu holds Change link…, Copy link and Remove call (in red).'],
  ] },
  { id: 'jalign', name: 'Inside the Join button', fb: 'the icon starts at a point that doesn\'t really make sense to me', note: 'Look at Join in the event and on Today.', scene: 'today', hl: '.join', opts: [
    ['left', 'Logo and name on the left, keys on the right', 'The logo starts 10 pt in from the button edge, like an icon in a row; ⌘ J sit at the right end. The logo is always in the same place.'],
    ['center', 'Centred, as now', 'Logo, name and keys centred as one group: the logo moves with the length of the tool name.'],
  ] },
  { id: 'card', name: 'Where Join starts on the Up next card', fb: 'for flat family dinner in up next in 25 minutes … the icon starts at a point that doesn\'t really make sense', note: 'Look at Today.', scene: 'today', hl: '.cd__j', opts: [
    ['full', 'The card\'s full width, Copy beside it', 'Join starts under the times, at the card\'s left edge (the "Up next" label), and runs to Copy on the right edge.'],
    ['title', 'From the title, Copy beside it', 'As now: Join starts where the title starts, 59 pt in.'],
    ['fullnocopy', 'Full width, no Copy on the card', 'Join alone across the card. Copy stays in the event.'],

  { id: 'add', lock: true, name: 'Adding a call', opts: [['menu', 'Add conferencing → menu: Google Meet (made on save) · Paste a link…', 'Locked in v4 round 2 and built: "Add conferencing" opens the call menu; Google Meet makes the link when you save, Paste a link… gives a field. See the scenes "No call yet", "Add a call: the menu" and "Meet link made on save".']] },
  { id: 'tool', lock: true, name: 'Tool on Join', opts: [['btn', 'Logo and "Join Google Meet" on the button', 'Round 3.']] },
  { id: 'btn', lock: true, name: 'Join button', opts: [['fill', 'Filled ink, ⌘ J keycaps', 'Round 3 and after: "i like ours way more".']] },
  { id: 'key', lock: true, name: 'Join shortcut', opts: [['cmdj', '⌘J', 'Round 2.']] },
  { id: 'copy', lock: true, name: 'Copy', opts: [['tip', 'Small icon, "Copy link" tip on hover', 'Round 3.']] },
  { id: 'fb', lock: true, name: 'After a copy', opts: [['check', 'Check and "Copied" for 1.5 s', 'Round 1.']] },
];

// ================= demo data (invent all of it) =================
function fresh() {
  return { copied: null, toast: null, editing: null, menu: null, events: {
    wg: { id: 'wg', title: 'Flat dinner', when: ['Sun 4 Oct', '19:00', '20:00', '1 h'], repeat: 'Every week on Sun', guests: '5 participants', gsub: '2 yes, 1 maybe, 1 no, 1 awaiting', place: 'Kitchen, 12 Harbour Street', cal: 'Personal', c: '#5BBF7A', link: 'https://meet.google.com/cmv-hjhb-qgb' },
    d5: { id: 'd5', title: 'Client call', when: ['Thu 1 Oct', '17:30', '18:30', '1 h'], repeat: 'Does not repeat', guests: '2 participants', gsub: '2 yes', place: '', cal: 'Work', c: '#5AA8E8', link: 'https://northwind.zoom.us/j/84512093377?pwd=Qm9kZXJ0YWJsZQ' },
    c3: { id: 'c3', title: 'Lunch with Theo', when: ['Wed 30 Sep', '14:00', '16:00', '2 h'], repeat: 'Does not repeat', guests: '2 participants', gsub: '2 yes', place: 'Market Hall, 42 Station Road', cal: 'Personal', c: '#6E8BFF', link: '' },
  } };
}

// ================= the app =================
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

    const own = [...el.childNodes].some(x => x.nodeType === 3 && x.textContent.trim()) || (el.matches('input, textarea') && el.value);
    if (!own) continue;
    const r = el.getBoundingClientRect(); if (!r.width || !r.height) continue;
    const cs = getComputedStyle(el); if (cs.visibility === 'hidden' || +cs.opacity === 0) continue;
    const f = parseFloat(cs.fontSize); sz.add(f); n[f] = (n[f] || 0) + 1; co.add(cs.color); wt.add(cs.fontWeight);
  }
  box.innerHTML = `In view: <b>${sz.size}</b> sizes · <b>${co.size}</b> text colours · <b>${wt.size}</b> weights<br>${[...sz].sort((a, b) => b - a).map(f => `${f} px ×${n[f]}`).join(' · ')}`;
}
// Alignment guides (G). Areas: [data-area]. Centred items: [data-centred] or .btn.
// Green: a left edge that 3 or more items share. Blue: a shared right edge. Red: 1 to 5 px off a line.
const CENTRED = '[data-centred], .btn';
function drawGuides() {
  desk.querySelector('#guides')?.remove(); window.__guides = null;
  if (!S.guides) return;
  const k = desk.getBoundingClientRect().width / desk.offsetWidth, dr = desk.getBoundingClientRect();
  const X = x => (x - dr.left) / k, Y = y => (y - dr.top) / k;
  let out = '', misses = [], cols = 0;
  desk.querySelectorAll('[data-area]').forEach(area => {
    const ar = area.getBoundingClientRect(), L = [], R = [];
    const vis = r => r.width > 0 && r.height > 0 && r.bottom > ar.top && r.top < ar.bottom;
    const push = (arr, x, r, what) => arr.push({ x: Math.round(X(x) * 2) / 2, t: Y(r.top), b: Y(r.bottom), l: X(r.left), w: r.width / k, what });
    const tw = document.createTreeWalker(area, NodeFilter.SHOW_TEXT, { acceptNode: x => x.textContent.trim() ? 1 : 2 });
    for (let t; (t = tw.nextNode());) {
      const el = t.parentElement; if (!el || el.closest(CENTRED)) continue;
      const cs = getComputedStyle(el); if (cs.textAlign === 'center' || cs.textAlign === 'right' || cs.marginLeft === 'auto') continue;
      const rg = document.createRange(); rg.selectNodeContents(t); const r = rg.getClientRects()[0];
      if (r && vis(r)) push(L, r.left, r, t.textContent.trim().slice(0, 24));
    }
    area.querySelectorAll('input, textarea').forEach(el => {
      const r = el.getBoundingClientRect(); if (!vis(r) || el.closest(CENTRED)) return;
      const cs = getComputedStyle(el); push(L, r.left + parseFloat(cs.paddingLeft) + parseFloat(cs.borderLeftWidth), r, (el.value || el.placeholder || '').slice(0, 24));
    });
    area.querySelectorAll('.ic, svg').forEach(el => {
      const r = el.getBoundingClientRect(); if (!vis(r) || el.closest(CENTRED)) return;
      if (!el.previousElementSibling) push(L, r.left, r, 'icon');
      if (!el.nextElementSibling && !el.nextSibling?.textContent?.trim()) push(R, r.right, r, 'icon');
    });
    const group = arr => { const g = []; arr.sort((a, b) => a.x - b.x).forEach(e => { const last = g[g.length - 1]; if (last && e.x - last.x0 <= .75) last.items.push(e); else g.push({ x0: e.x, items: [e] }); }); g.forEach(c => { c.x = c.items.reduce((a, b) => a + b.x, 0) / c.items.length; }); return g; };
    const lines = (arr, cls) => {
      const g = group(arr), strong = g.filter(c => c.items.length >= 3);
      strong.forEach(c => { cols++; out += `<div class="gv ${cls}" style="left:${c.x}px;top:${Y(ar.top)}px;height:${ar.height / k}px"><span>${Math.round(c.x - X(ar.left))}</span></div>`; });
      g.filter(c => c.items.length < 3).forEach(c => {
        const near = strong.find(s2 => Math.abs(s2.x - c.x) >= 1 && Math.abs(s2.x - c.x) <= 5); if (!near) return;
        c.items.forEach(it => { const d = (it.x - near.x).toFixed(1); misses.push({ area: area.dataset.area, what: it.what, x: it.x, off: +d }); out += `<div class="bx" style="left:${it.l}px;top:${it.t}px;width:${Math.max(it.w, 2)}px;height:${it.b - it.t}px"><span>${d > 0 ? '+' : ''}${d}</span></div>`; });
      });
    };
    lines(L, ''); lines(R, 'r');
    out += `<div class="ol" style="left:${X(ar.left)}px;top:${Y(ar.top)}px;width:${ar.width / k}px;height:${ar.height / k}px"></div>`;
  });
  window.__guides = misses;
  desk.insertAdjacentHTML('beforeend', `<div id="guides">${out}<div class="legend"><b>Alignment guides</b> · G to hide<br>green: shared left edge (3+) · blue: shared right edge<br>red: ${misses.length} item${misses.length === 1 ? '' : 's'} 1 to 5 px off a line · ${cols} lines</div></div>`);
}

picker.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return;
  const a = t.dataset.a;
  if (t.dataset.scene) return preset(t.dataset.scene);
  if (t.dataset.d) { clearTimeout(PT); PV = null; S.c[t.dataset.d] = t.dataset.v; S.before = false; }
  else if (a === 'before' || a === 'after') S.before = a === 'before';
  else if (a === 'hover') S.hover = S.hover === false;
  else if (a === 'guides') S.guides = !S.guides;
  else if (a === 'agt') { S.agt = S.agt === false; save(); window.AGT?.set(S.agt, true); }
  else if (a === 'unlock') S.unlock = !S.unlock;
  else if (a === 'copy') { navigator.clipboard?.writeText(picksText()); t.textContent = 'Copied'; return; }
  else if (a === 'reset') { DECISIONS.forEach(d => { S.c[d.id] = d.lock ? LOCKED[d.id] : d.opts[0][0]; }); S.before = false; }
  else if (a === 'demo') A = fresh();
  else return;
  save(); renderPicker();
});
// Hover intent: show an option after 90 ms. The gaps inside one decision keep the preview, so nothing flickers.
let PT = null;
picker.addEventListener('mouseover', ev => {
  const o = ev.target.closest('.pk-opt[data-d]'), blk = ev.target.closest('.pk-dec');
  clearTimeout(PT);
  if (o) PT = setTimeout(() => previewOn(o.dataset.d, o.dataset.v), 90);
  else if (PV && blk && blk.querySelector(`[data-d="${PV.id}"]`)) return;
  else if (PV) PT = setTimeout(() => previewOff(), 140);
});
picker.addEventListener('mouseleave', () => { clearTimeout(PT); previewOff(); });
desk.addEventListener('click', ev => { const t = ev.target.closest('button'); if (t && appClick(t)) { save(); renderPicker(); } });
document.addEventListener('keydown', ev => {
  if (ev.target.closest?.('input, textarea') || ev.metaKey || ev.ctrlKey) return;
  if (ev.key === 'g' || ev.key === 'G') { S.guides = !S.guides; save(); renderPicker(); }
  else if ((ev.key === 'b' || ev.key === 'B') && Object.keys(BEFORE).length) { S.before = !S.before; save(); renderPicker(); }
});
window.addEventListener('resize', () => { fit(); drawGuides(); });
// The Join shortcut: the picked key joins the selected event's call, or the Up next call on Today.
document.addEventListener('keydown', ev => {
  if (!ev.metaKey || ev.key.toLowerCase() !== 'j' || ev.altKey || ev.ctrlKey) return;
  if (ev.shiftKey !== (C('key') === 'cmdshj')) return;
  ev.preventDefault(); flash(null, 'Would open the call in your browser'); render();
});
window.addEventListener('hashchange', () => { const id = location.hash.slice(1).split('&')[0]; if (id) preset(id); });
fit();
const scene0 = location.hash.slice(1).split('&')[0];
if (scene0 && SCENES.some(s => s[0] === scene0)) preset(scene0); else renderPicker();
document.fonts?.ready.then(() => { fit(); drawGuides(); });
</script>
<div id="agentation"></div>
<script type="module">
// Agentation (agentation.com): click any element, write a note. The picker toggle turns it on and off.
// It loads from esm.sh, so it needs the network. The mockup works without it. Its notes go into "Copy my picks".
const deps = '?deps=react@18.3.1,react-dom@18.3.1';
let lib = null, root = null;
async function set(on, open) {
  if (!on) { root?.unmount(); root = null; agtMsg('Off.'); return; }
  if (root) return;
  agtMsg('Loading from esm.sh …');
  try {
    lib = lib || await Promise.all([import('https://esm.sh/react@18.3.1'), import('https://esm.sh/react-dom@18.3.1/client' + deps), import('https://esm.sh/agentation@3.1.2' + deps)]);
    const [React, { createRoot }, { Agentation }] = lib;
    root = createRoot(document.getElementById('agentation'));
    root.render(React.createElement(Agentation, {
      appName: `${PRODUCT} ${VERSION} round ${ROUND}`, className: 'agt-host',
      identifyingAttributes: ['data-area', 'data-d', 'data-v', 'data-go', 'data-copy', 'data-join'],
      onAnnotationAdd: NOTES.set, onAnnotationUpdate: NOTES.set, onAnnotationDelete: NOTES.del, onAnnotationsClear: NOTES.clear,
    }));
    agtMsg('On. ⌘⇧F or the button at the bottom right of the app opens it. Then click an element and write.');
    // After a click on the toggle, open the toolbar at once.
    if (open) setTimeout(() => document.dispatchEvent(new KeyboardEvent('keydown', { key: 'F', code: 'KeyF', metaKey: true, shiftKey: true, bubbles: true })), 250);
  } catch (e) { root = null; agtMsg('Did not load (no network?). The mockup works without it.'); console.info('Agentation did not load.', e); }
}
window.AGT = { set };
if (!shot) set(S.agt !== false); else agtMsg('');
</script>
