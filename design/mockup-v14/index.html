<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendr Busy Hours</title>
<!-- Calendr v14 round 1: the time grid without "+N", in realistic weeks, with knobs. -->
<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #08080a; color: #d8d8dc; font: 13px/1.4 -apple-system, system-ui, sans-serif; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; padding: 0; }
input { font: inherit; color: inherit; background: none; border: 0; outline: 0; }
#root { display: flex; height: 100%; }
#stage { flex: 1; position: relative; overflow: hidden; }
.shot #picker { display: none; }

/* ---------- picker (outside the app) ---------- */
#picker { width: 380px; flex: none; border-left: 1px solid #222; background: #111113; overflow-y: auto; padding: 18px 18px 84px; }
#picker h1 { font-size: 15px; font-weight: 650; color: #f2f2f4; margin: 0; }
#picker h2 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: #6c6c74; font-weight: 600; margin: 22px 0 8px; }
#picker .lede { color: #8a8a92; font-size: 12px; margin: 4px 0 14px; }
.pk-btn { padding: 5px 9px; border-radius: 7px; background: #1b1b1f; color: #b4b4bb; font-size: 12px; border: 1px solid #26262b; }
.pk-btn:hover { background: #222227; color: #eee; }
.pk-btn.on { background: #ececf0; color: #111; border-color: #ececf0; }
.pk-scenes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.pk-notes { padding: 10px 12px; border-radius: 9px; background: #17171a; border: 1px solid #222226; color: #a6a6ae; font-size: 12px; }
.pk-notes ul { margin: 0; padding-left: 15px; }
.pk-ba { display: flex; gap: 4px; align-items: center; margin-bottom: 10px; }
.pk-ba span { color: #6c6c74; font-size: 11px; margin-left: 4px; }
.pk-tog { display: flex; gap: 8px; align-items: center; color: #a6a6ae; font-size: 12px; margin-top: 6px; }
.pk-tog i { width: 24px; height: 14px; border-radius: 7px; background: #2a2a30; position: relative; flex: none; }
.pk-tog i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 10px; height: 10px; border-radius: 50%; background: #8a8a92; transition: transform .15s; }
.pk-tog.on i { background: #ececf0; } .pk-tog.on i::after { transform: translateX(10px); background: #111; }
.pk-audit { margin-top: 8px; color: #8a8a92; font-size: 11.5px; }
.pk-audit b { color: #eee; }
.pk-dec { margin-bottom: 14px; }
.pk-dec > b { color: #f2f2f4; font-size: 12.5px; }
.pk-dec p { color: #8a8a92; font-size: 12px; margin: 3px 0 6px; }
.pk-new { color: #a6a6ae; font-size: 12px; margin: 3px 0 6px; }
.pk-new q { color: #e6e6ea; }
.pk-opt { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 8px; border-radius: 7px; color: #b4b4bb; font-size: 12px; }
.pk-opt:hover { background: #1b1b1f; color: #eee; }
.pk-opt.on { color: #f4f4f6; background: #1d1d22; }
.pk-opt .r { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #4a4a52; flex: none; }
.pk-opt.on .r { border-color: #f4f4f6; background: radial-gradient(#f4f4f6 0 2.5px, transparent 3px); }
.pk-opt .end { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.pk-opt .rec, .pk-opt .lk { font-size: 10.5px; color: #6c6c74; }
.pk-opt .hq { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #3a3a42; color: #8a8a92; font-size: 10px; display: inline-grid; place-items: center; position: relative; }
.pk-opt .hq:hover::after { content: attr(data-help); position: absolute; right: -4px; top: 22px; width: 270px; padding: 8px 10px; border-radius: 8px; background: #26262c; border: 1px solid #3a3a42; color: #e6e6ea; font-size: 11.5px; line-height: 1.45; white-space: normal; z-index: 10; }
.pk-lock { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 3px 0; color: #8a8a92; }
.pk-lock b { font-weight: 500; color: #c4c4cb; }
.pk-foot { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 22px; }
/* Agentation toolbar: bottom right of the app, not over the picker. */
.agt-host { right: 396px !important; bottom: 16px !important; }
#picker .read { color: #a6a6ae; font-size: 12px; margin: -6px 0 14px; padding-left: 10px; border-left: 2px solid #2a2a30; }
#picks { margin-top: 10px; width: 100%; height: 150px; background: #141417; color: #bdbdc4; border: 1px solid #25252a; border-radius: 8px; padding: 8px; font: 11px/1.45 ui-monospace, Menlo, monospace; resize: vertical; }

/* ---------- preview: crossfade, short glow, alignment guides ---------- */
.ghost { pointer-events: none; z-index: 140; transition: opacity 140ms ease; }
.pvhl { animation: pvpulse 900ms ease-out forwards; }
@keyframes pvpulse { 0% { box-shadow: 0 0 0 0 rgba(90,160,255,.9), 0 0 0 1.5px rgba(90,160,255,.9); } 60% { box-shadow: 0 0 0 8px rgba(90,160,255,0), 0 0 0 1.5px rgba(90,160,255,.9); } 100% { box-shadow: 0 0 0 8px rgba(90,160,255,0), 0 0 0 1.5px transparent; } }
#guides { position: absolute; inset: 0; pointer-events: none; z-index: 150; }
#guides .gv { position: absolute; width: 0; border-left: 1px solid rgba(64, 214, 120, .55); }
#guides .gv.r { border-left-color: rgba(90, 160, 255, .55); }
#guides .gv span { position: absolute; top: 2px; left: 2px; font: 9px ui-monospace, Menlo, monospace; color: rgba(64, 214, 120, .95); background: rgba(0,0,0,.6); padding: 0 2px; }
#guides .bx { position: absolute; outline: 1px solid rgba(255, 70, 90, .95); background: rgba(255, 70, 90, .12); }
#guides .bx span { position: absolute; top: -12px; left: 0; font: 9px ui-monospace, Menlo, monospace; color: #fff; background: rgba(220, 40, 60, .9); padding: 0 3px; white-space: nowrap; }
#guides .ol { position: absolute; outline: 1px dashed rgba(255, 255, 255, .14); }
#guides .legend { position: absolute; left: 12px; bottom: 12px; padding: 8px 10px; border-radius: 8px; background: rgba(10,10,12,.88); border: 1px solid rgba(255,255,255,.12); font: 11px/1.5 -apple-system, system-ui; color: #ddd; }

/* ================= the app: week / day grid ================= */
@font-face { font-family: "Inter"; src: url("../mockup-v11/fonts/InterVariable.woff2") format("woff2"); font-weight: 100 900; }
.desk { --bg: #0B0B0C; --rail: #070708; --bg3: #2A2A2C; --hover: #161617; --selected: #1E1E1F; --hair: #1C1C1D; --grid: #1A1A1B; --grid2: #141415;
  --fg: #EBEBED; --fg2: #CCCCCE; --fg3: #A8A8AA; --act: #EBEBED; --onact: #0B0B0C; --now: #E5484D;
  --blue: #0E1A2C; --blueBar: #4A78D8; --blueT: #DCE4F2; --orange: #26150B; --orangeBar: #C8671F; --orangeT: #F1DCCB;
  --green: #0C2016; --greenBar: #2E9E5B; --greenT: #D3EEDD; --violet: #1B1430; --violetBar: #8A63D2; --violetT: #E4DCF5;
  --font: "Inter", -apple-system, system-ui, sans-serif; --fs: 13px; --fs-ev: 12px; --fs-s: 11px; }
.desk.paper { --bg: #FBFBFB; --rail: #F4F4F5; --bg3: #DCDCDC; --hover: #F1F1F1; --selected: #EAEAEB; --hair: #E8E8E8; --grid: #E6E6E7; --grid2: #F0F0F1;
  --fg: #1D1D20; --fg2: #4A4A50; --fg3: #606067; --act: #1D1D20; --onact: #FBFBFB;
  --blue: #E3ECFB; --blueBar: #3E6FD8; --blueT: #1C2E52; --orange: #FBE9DC; --orangeBar: #D0651B; --orangeT: #57290A;
  --green: #DDF3E6; --greenBar: #23894C; --greenT: #0F3A22; --violet: #ECE5FA; --violetBar: #7A4FD0; --violetT: #2E1A57; }
.desk { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: var(--bg); color: var(--fg); font: var(--fs)/1.4 var(--font); display: flex; -webkit-font-smoothing: antialiased; }
.side { width: 220px; flex: none; background: var(--rail); border-right: 1px solid var(--hair); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
.side .t { font-weight: 600; margin: 0 8px 10px; }
.side button { height: 28px; padding: 0 8px; border-radius: 8px; color: var(--fg2); text-align: left; }
.side button:hover { background: var(--hover); } .side button.on { background: var(--selected); color: var(--fg); }
.side .sp { flex: 1; }
.side .hint { color: var(--fg3); font-size: var(--fs-s); padding: 8px; line-height: 1.45; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top { height: 48px; flex: none; display: flex; align-items: center; padding: 0 16px; font-size: 18px; font-weight: 600; gap: 8px; }
.top span { color: var(--fg3); font-weight: 400; }
.dh { display: flex; height: 36px; flex: none; border-bottom: 1px solid var(--hair); }
.dh .g { width: 56px; flex: none; }
.dh .c { flex: 1; min-width: 0; display: flex; align-items: center; padding-left: 8px; gap: 6px; font-size: var(--fs-s); color: var(--fg3); }
.dh .c .n { font-size: var(--fs); color: var(--fg); }
.dh .c.today { color: var(--fg); } .dh .c.today .n { background: var(--act); color: var(--onact); border-radius: 6px; padding: 0 5px; line-height: 18px; font-weight: 600; }
.gridwrap { flex: 1; overflow: hidden; position: relative; }
.grid { position: relative; display: flex; }
.gut { width: 56px; flex: none; position: relative; }
.gut span { position: absolute; right: 8px; font-size: var(--fs-s); color: var(--fg3); transform: translateY(-50%); }
.col { flex: 1; min-width: 0; position: relative; border-left: 1px solid var(--grid); }
.hl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--grid); }
.ev { position: absolute; border-radius: 4px; padding: 3px 6px 3px 11px; overflow: hidden; background: var(--fill); color: var(--tc); font-size: var(--fs-ev); line-height: 15px; text-align: left; display: flex; flex-direction: column; cursor: default; }
.ev::before { content: ""; position: absolute; left: 3px; top: 3px; bottom: 3px; width: 3px; border-radius: 1.5px; background: var(--bar); }
.ev .t { font-weight: 500; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; }
.ev .m { opacity: .72; font-size: var(--fs-s); line-height: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev.one { flex-direction: row; gap: 6px; align-items: center; padding-top: 0; padding-bottom: 0; white-space: nowrap; }
.ev.one .t { display: block; text-overflow: ellipsis; white-space: nowrap; }
.ev.narrow .t { display: block; white-space: nowrap; text-overflow: clip; } .ev.narrow .m { display: none; }
.ev.thin { padding-left: 8px; padding-right: 2px; } .ev.thin .t { font-size: var(--fs-s); }
.ev.cut { box-shadow: -1px 0 0 var(--bg); }
.ev.un { background: var(--bg); box-shadow: inset 0 0 0 1px var(--bar), -1px 0 0 var(--bg); color: var(--fg2); }
.ev.un::before { opacity: .55; }
.ev.sel { box-shadow: inset 0 0 0 1.5px var(--fg); z-index: 60 !important; }
.ev:hover { filter: brightness(1.12); } .paper .ev:hover { filter: brightness(.97); }
.c-blue { --fill: var(--blue); --bar: var(--blueBar); --tc: var(--blueT); } .c-orange { --fill: var(--orange); --bar: var(--orangeBar); --tc: var(--orangeT); }
.c-green { --fill: var(--green); --bar: var(--greenBar); --tc: var(--greenT); } .c-violet { --fill: var(--violet); --bar: var(--violetBar); --tc: var(--violetT); }
.pn { position: absolute; height: 16px; padding: 0 5px; min-width: 22px; text-align: center; font: 600 10.5px/16px var(--font); background: var(--bg3); color: var(--fg); border-radius: 4px; box-shadow: 0 0 0 1.5px var(--bg); z-index: 70; }
.nowl { position: absolute; left: 0; right: 0; height: 0; border-top: 1.5px solid var(--now); z-index: 80; }
.tag { position: absolute; left: 6px; font-size: 10px; color: var(--fg3); z-index: 1; }

.ev.wrap { padding: 2px 3px 2px 8px; } .ev.wrap::before { left: 2px; top: 2px; bottom: 2px; width: 2.5px; }
.ev.wrap .t { font-size: var(--fs-s); line-height: 13px; -webkit-line-clamp: 5; word-break: break-word; overflow-wrap: anywhere; hyphens: auto; }
.ev.wrap .m { display: none; }
.lbl { position: absolute; height: 17px; padding: 0 5px 0 9px; font-size: var(--fs-s); font-weight: 500; line-height: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--fill); color: var(--tc); border-radius: 4px 4px 4px 0; box-shadow: 0 0 0 1px var(--bg); }
.lbl::before { content: ""; position: absolute; left: 3px; top: 3px; bottom: 3px; width: 3px; border-radius: 1.5px; background: var(--bar); }
.lbl.un { background: var(--bg); color: var(--fg2); box-shadow: inset 0 0 0 1px var(--bar); }
.lane { position: absolute; width: 4px; border-radius: 2px; background: var(--bar); z-index: 12; }
.lane.un { background: none; box-shadow: inset 0 0 0 1px var(--bar); }
.lanebox { position: absolute; border-radius: 4px; background: var(--grid2); z-index: 10; }
.row { position: absolute; height: 16px; display: flex; gap: 5px; align-items: center; padding: 0 4px 0 9px; border-radius: 4px; background: var(--fill); color: var(--tc); font-size: var(--fs-s); line-height: 16px; white-space: nowrap; overflow: hidden; z-index: 14; }
.row::before { content: ""; position: absolute; left: 3px; top: 3px; bottom: 3px; width: 3px; border-radius: 1.5px; background: var(--bar); }
.row .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; min-width: 0; } .row .m { opacity: .7; flex: none; }
.row.un { background: var(--bg); color: var(--fg2); box-shadow: inset 0 0 0 1px var(--bar); } .row.sel { box-shadow: inset 0 0 0 1.5px var(--fg); }

.ev.nar { padding: 2px 3px 2px 9px; } .ev.nar::before { left: 3px; top: 2px; bottom: 2px; width: 3px; }
.ev.nar .t { font-size: var(--fs-s); line-height: 13px; -webkit-line-clamp: var(--lc); overflow-wrap: anywhere; hyphens: auto; }
.ev.nar.one .t { -webkit-line-clamp: 1; }
.ev.thin { padding-left: 7px; padding-right: 1px; } .ev.thin::before { left: 2px; width: 2.5px; }
.top { gap: 14px; } .look { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--fg2); max-width: 780px; line-height: 1.35; }
.look b { color: var(--fg); font-weight: 600; } .look i { font-style: normal; color: var(--fg3); margin-left: 6px; white-space: nowrap; }
.col.crowd { background: linear-gradient(transparent, transparent); }
.pk-knob { margin: 0 0 10px; } .pk-knob .kh { display: flex; gap: 8px; align-items: center; font-size: 12px; color: #a6a6ae; }
.pk-knob .kh b { color: #e6e6ea; font-weight: 500; } .pk-knob .kh span:not(.hq) { margin-left: auto; color: #f4f4f6; font-variant-numeric: tabular-nums; }
.pk-knob .hq { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #3a3a42; color: #8a8a92; font-size: 10px; display: inline-grid; place-items: center; position: relative; }
.pk-knob .hq:hover::after { content: attr(data-help); position: absolute; right: -4px; top: 22px; width: 260px; padding: 8px 10px; border-radius: 8px; background: #26262c; border: 1px solid #3a3a42; color: #e6e6ea; font-size: 11.5px; line-height: 1.45; z-index: 10; }
.pk-knob input { width: 100%; accent-color: #ececf0; }
.pk-arg { color: #c4c4cb !important; border-left: 2px solid #3a3a42; padding-left: 8px; }
</style>
</head>
<body>
<div id="root"><div id="stage"><div class="desk" id="desk"></div></div><aside id="picker"></aside></div>
<script>
// ================= edit for each round =================
const PRODUCT = 'Calendr', VERSION = 'v14', ROUND = 1;
const DESK = { w: 1440, h: 900 };
const SCENES = [
  ['typical', 'A normal week'], ['double', 'Double-booked'], ['holds', 'Invites not answered'], ['manager', 'Manager’s Wednesday'],
  ['team', 'Team calendars on'], ['conf', 'Conference Thursday'], ['recruit', 'Interview day'], ['pings', 'Short reminders'],
  ['confday', 'Day view: conference'], ['teamday', 'Day view: team calendars']];
const HOWTO = ['Left: the scenarios, from a normal week to the worst case. Each one says what to look at in the top bar.',
  'Two decisions: how 2 or 3 overlaps look, and how a crowded spot (4 or more at once) looks.',
  'Knobs below the decisions change the numbers live: when a spot counts as crowded, minimum column width, how much a busy day may widen, title lines.',
  'Click an event to select it (it comes to the front). Ink / Paper at the bottom left.'];
const READ = 'Quiet tool UI: every event visible without a click, titles readable first, nothing new to learn for a normal week. Dials: variance 2, motion 2, density 7.';
const LOCKED = {};
const BEFORE = {};
const P = (v, l, h) => [v, l, h];
const FB = 'remove the n+ more in the day view like the actual events … see where it looks best and most infomration still can be viewed at a glance';
const DECISIONS = [
  { id: 'normal', name: '2 or 3 events at the same time', fb: 'actually realisitc scnerarios', scene: 'double', hl: '.ev',
    note: 'My pick: keep the locked smart layout. It is what a normal week looks like (see "A normal week", "Double-booked"); the "+N" problem only starts at 3+ covering events, and the smart layout already shows 3. Changing it would redesign the common case to fix the rare one.',
    opts: [
    P('smart', 'Smart, as locked (cascade; side by side when they start together)', 'Why: the long meeting stays full width and readable; the later one sits on top, shifted 14 pt, so you see both titles. Cost: the covered part of the long event is hidden behind the short one.'),
    P('columns', 'Side by side, always', 'Why: nothing is ever covered. Cost: in a week column (~165 pt) two events get ~80 pt each, so long titles cut after a word or two, even for one small clash.')] },
  { id: 'crowd', name: 'A crowded spot (from "Crowded from" events at once)', fb: FB, scene: 'team', hl: '.col.crowd .ev, .col.crowd .row, .col.crowd .lane',
    note: 'My pick: side by side, and let the crowded day borrow width from quiet days. Every event keeps its real time and height, so you read the day as a schedule, not a list. Lanes are the fallback only when columns would still be under the minimum width (turn "Min column width" up to see them take over).',
    opts: [
    P('columns', 'Side by side; a busy day gets wider; lanes below the minimum', 'Why: each event stays a block at its real time; the day with the clash widens (up to "Widen busy day"), quiet days give up a little. Below "Min column width" the spot turns into lanes + titles. Cost: day columns are not all equal width that week.'),
    P('lanes', 'Colour lanes + a title list', 'Why: every title and start time is readable in one line, even 8 at once in a 165 pt column. Cost: the titles no longer sit at their exact time or show their length; the lanes on the left carry that.'),
    P('wrap', 'Side by side, equal days, titles wrap', 'Why: simplest rule, the week grid stays even. Cost: at 4+ events, columns drop to ~35 pt and titles break mid-word.'),
    P('cascade', 'Keep cascading, titles always on top', 'Why: closest to the locked look. Cost: bodies cover each other, so it is hard to see where each event ends.'),
    P('now', 'As now: "+N" chip (to compare)', 'The app today: the 3rd covering event and later hide behind "+N".')] },
];
const KNOBS = [
  ['crowdAt', 'Crowded from', 3, 6, 1, 4, v => `${v} at once`, 'A spot with this many events at the same moment uses the "crowded" option; fewer uses the first decision.'],
  ['minCol', 'Min column width', 40, 120, 5, 55, v => `${v} pt`, 'Side by side never goes narrower than this. Below it, the spot becomes lanes + titles. 55 pt fits about 8 characters a line.'],
  ['widen', 'Widen busy day up to', 1, 3, 0.25, 2.5, v => v === 1 ? 'off' : `${v}×`, 'Week view: a day whose columns would be under the minimum takes up to this much of a normal day’s width; other days shrink to match.'],
  ['lines', 'Title lines in a narrow event', 1, 4, 1, 3, v => `${v}`, 'How many lines a title may wrap to when an event is under 90 pt wide.'],
  ['ntime', 'Time in narrow events', 0, 1, 1, 0, v => v ? 'shown' : 'hidden', 'Show "9:30" under the title when an event is under 90 pt wide.'],
  ['hour', 'Hour height', 44, 96, 4, 60, v => `${v} pt`, 'The app fits this to the window; try small values to see what crowds first.'],
  ['days', 'Days in week view', 5, 7, 2, 7, v => `${v} days`, '5 days gives each day 40% more width.'],
];
const SCENE_OF = {};

// ================= demo data =================
// Week of Mon 16 Nov 2026, today Sat 21. Calendars: work (blue), personal (green), team (orange), recruiting (violet).
const H = (h, m = 0) => h * 60 + m;
const T = s => { const [a, b] = s.split('-').map(x => { const [h, m] = x.split(':'); return H(+h, +(m || 0)); }); return [a, b]; };
// day, "9:00-10:30", title, colour, flags ('u' = not answered)
const E = (day, span, title, c = 'blue', f = '') => { const [s, e] = T(span); return { id: `${day}-${s}-${title}`, day, s, e, title, c, un: f.includes('u') }; };
const BASE = [
  E(0, '9:30-9:45', 'Standup'), E(1, '9:30-9:45', 'Standup'), E(2, '9:30-9:45', 'Standup'), E(3, '9:30-9:45', 'Standup'), E(4, '9:30-9:45', 'Standup'),
  E(0, '12:30-13:15', 'Lunch', 'green'), E(4, '17:00-18:00', 'Climbing', 'green'), E(5, '10:00-11:30', 'Farmers market', 'green'),
];
const DATA = {
  typical: { look: 'A normal week. Tue 11:00 and Thu 14:00 have small clashes. Nothing crowded: this should look exactly as today.', ev: [...BASE,

function picksText() {

  return `# ${PRODUCT} ${VERSION} round ${ROUND} picks\n## Open\n${DECISIONS.filter(d => !d.lock).map(line).join('\n') || '- Nothing open'}\n## Locked\n${DECISIONS.filter(d => d.lock).map(line).join('\n')}${knobsText()}${notes ? `\n## Notes on elements\n${notes}` : ''}\n## Notes\n- `;

// Agentation state line in the picker. The module script at the end sets it.
let AGT_MSG = '';
function agtMsg(m) { AGT_MSG = m; const el = document.getElementById('agt-state'); if (el) el.textContent = m; }
// Notes from Agentation (the module script at the end). They go into the picks text.
const NOTES = {
  set(a) { const old = (S.notes || []).find(n => n.id === a.id); S.notes = (S.notes || []).filter(n => n.id !== a.id).concat({ id: a.id, scene: old ? old.scene : S.scene, path: a.elementPath, text: NOTES.text(a), comment: a.comment }); NOTES.done(); },
  text(a) { let el = null; try { el = document.querySelector(a.elementPath); } catch (e) {} while (el && el !== desk && !el.innerText.trim()) el = el.parentElement; return (a.selectedText || el?.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 60); },
  del(a) { S.notes = (S.notes || []).filter(n => n.id !== a.id); NOTES.done(); },

// Hover preview: the option applies while hovered, its scene opens, and the hl elements glow once.
// Leaving goes back to the pick and to the scene you were on. A click keeps the option and the scene.
// Only the app renders again, never the picker, so the picker does not move.
function previewOn(id, v) {
  if (S.hover === false) return;
  const d = DECISIONS.find(x => x.id === id); if (!d) return;
  if (PV && PV.id !== id) previewOff(true);
  if (!PV) PV = { id, orig: S.c[id], scene: S.scene };
  if (PV.v === v) return;
  PV.v = v; S.c[id] = v;
  if (d.scene && S.scene !== d.scene) S.scene = d.scene;
  render(true);
}
function previewOff(silent) { if (!PV) return; S.c[PV.id] = PV.orig; S.scene = PV.scene; PV = null; save(); if (!silent) render(true); }
function markPreview() {
  const d = PV && DECISIONS.find(x => x.id === PV.id);
  if (d && d.hl) desk.querySelectorAll(d.hl).forEach(el => el.classList.add('pvhl'));

// Counter: text sizes, colours and weights in view.
function audit() {
  const box = document.getElementById('audit'); if (!box) return;
  const sz = new Set(), co = new Set(), wt = new Set(), n = {};
  for (const el of desk.querySelectorAll('*')) {
    if (el.closest('#guides, [data-os]')) continue;
    const own = [...el.childNodes].some(x => x.nodeType === 3 && x.textContent.trim()) || (el.matches('input, textarea') && el.value);
    if (!own) continue;
    const r = el.getBoundingClientRect(); if (!r.width || !r.height) continue;
    const cs = getComputedStyle(el); if (cs.visibility === 'hidden' || +cs.opacity === 0) continue;
    const f = parseFloat(cs.fontSize); sz.add(f); n[f] = (n[f] || 0) + 1; co.add(cs.color); wt.add(cs.fontWeight);
  }
  box.innerHTML = `In view: <b>${sz.size}</b> sizes · <b>${co.size}</b> text colours · <b>${wt.size}</b> weights<br>${[...sz].sort((a, b) => b - a).map(f => `${f} px ×${n[f]}`).join(' · ')}`;

// Alignment guides (G). Areas: [data-area]. Centred items: [data-centred] or .btn.
// Green: a left edge that 3 or more items share. Blue: a shared right edge. Red: 1 to 5 px off a line.
const CENTRED = '[data-centred], .btn';
function drawGuides() {
  desk.querySelector('#guides')?.remove(); window.__guides = null;
  if (!S.guides) return;
  const k = desk.getBoundingClientRect().width / desk.offsetWidth, dr = desk.getBoundingClientRect();
  const X = x => (x - dr.left) / k, Y = y => (y - dr.top) / k;
  let out = '', misses = [], cols = 0;
  desk.querySelectorAll('[data-area]').forEach(area => {
    const ar = area.getBoundingClientRect(), L = [], R = [];
    const vis = r => r.width > 0 && r.height > 0 && r.bottom > ar.top && r.top < ar.bottom;
    const push = (arr, x, r, what) => arr.push({ x: Math.round(X(x) * 2) / 2, t: Y(r.top), b: Y(r.bottom), l: X(r.left), w: r.width / k, what });
    const tw = document.createTreeWalker(area, NodeFilter.SHOW_TEXT, { acceptNode: x => x.textContent.trim() ? 1 : 2 });
    for (let t; (t = tw.nextNode());) {
      const el = t.parentElement; if (!el || el.closest(CENTRED)) continue;
      const cs = getComputedStyle(el); if (cs.textAlign === 'center' || cs.textAlign === 'right' || cs.marginLeft === 'auto') continue;
      const rg = document.createRange(); rg.selectNodeContents(t); const r = rg.getClientRects()[0];

      const r = el.getBoundingClientRect(); if (!vis(r) || el.closest(CENTRED)) return;

      });

  });

  desk.insertAdjacentHTML('beforeend', `<div id="guides">${out}<div class="legend"><b>Alignment guides</b> · G to hide<br>green: shared left edge (3+) · blue: shared right edge<br>red: ${misses.length} item${misses.length === 1 ? '' : 's'} 1 to 5 px off a line · ${cols} lines</div></div>`);
}

picker.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return;
  const a = t.dataset.a;
  if (t.dataset.scene) return preset(t.dataset.scene);
  if (t.dataset.d) { clearTimeout(PT); PV = null; S.c[t.dataset.d] = t.dataset.v; S.before = false; }
  else if (a === 'before' || a === 'after') S.before = a === 'before';
  else if (a === 'hover') S.hover = S.hover === false;
  else if (a === 'guides') S.guides = !S.guides;
  else if (a === 'agt') { S.agt = S.agt === false; save(); window.AGT?.set(S.agt, true); }
  else if (a === 'unlock') S.unlock = !S.unlock;
  else if (a === 'copy') { navigator.clipboard?.writeText(picksText()); t.textContent = 'Copied'; return; }
  else if (a === 'reset') { DECISIONS.forEach(d => { S.c[d.id] = d.lock ? LOCKED[d.id] : d.opts[0][0]; }); S.before = false; }

// Hover intent: show an option after 90 ms. The gaps inside one decision keep the preview, so nothing flickers.
let PT = null;
picker.addEventListener('mouseover', ev => {
  const o = ev.target.closest('.pk-opt[data-d]'), blk = ev.target.closest('.pk-dec');
  clearTimeout(PT);
  if (o) PT = setTimeout(() => previewOn(o.dataset.d, o.dataset.v), 90);

picker.addEventListener('input', ev => {
  const id = ev.target.dataset?.k; if (!id) return;
  S.k = S.k || {}; S.k[id] = +ev.target.value;
  const k = KNOBS.find(x => x[0] === id); document.getElementById('kv-' + id).textContent = k[6](S.k[id]);

});
picker.addEventListener('mouseleave', () => { clearTimeout(PT); previewOff(); });
desk.addEventListener('click', ev => { const t = ev.target.closest('button'); if (t && appClick(t)) { save(); renderPicker(); } });
document.addEventListener('keydown', ev => {
  if (ev.target.closest?.('input, textarea') || ev.metaKey || ev.ctrlKey) return;
  if (ev.key === 'g' || ev.key === 'G') { S.guides = !S.guides; save(); renderPicker(); }

window.addEventListener('resize', () => { fit(); drawGuides(); });
window.addEventListener('hashchange', () => { const id = location.hash.slice(1).split('&')[0]; if (id) preset(id); });
fit();
const scene0 = location.hash.slice(1).split('&')[0];
if (scene0 && SCENES.some(s => s[0] === scene0)) preset(scene0); else renderPicker();
document.fonts?.ready.then(() => { fit(); drawGuides(); });
</script>
<div id="agentation"></div>
<script type="module">
// Agentation (agentation.com): click any element, write a note. The picker toggle turns it on and off.
// It loads from esm.sh, so it needs the network. The mockup works without it. Its notes go into "Copy my picks".
const deps = '?deps=react@18.3.1,react-dom@18.3.1';
let lib = null, root = null;
async function set(on, open) {
  if (!on) { root?.unmount(); root = null; agtMsg('Off.'); return; }
  if (root) return;
  agtMsg('Loading from esm.sh …');
  try {
    lib = lib || await Promise.all([import('https://esm.sh/react@18.3.1'), import('https://esm.sh/react-dom@18.3.1/client' + deps), import('https://esm.sh/agentation@3.1.2' + deps)]);
    const [React, { createRoot }, { Agentation }] = lib;
    root = createRoot(document.getElementById('agentation'));
    root.render(React.createElement(Agentation, {
      appName: `${PRODUCT} ${VERSION} round ${ROUND}`, className: 'agt-host',
      identifyingAttributes: ['data-area', 'data-k', 'data-d', 'data-v', 'data-go', 'data-open'],
      onAnnotationAdd: NOTES.set, onAnnotationUpdate: NOTES.set, onAnnotationDelete: NOTES.del, onAnnotationsClear: NOTES.clear,
    }));
    agtMsg('On. ⌘⇧F or the button at the bottom right of the app opens it. Then click an element and write.');
    // After a click on the toggle, open the toolbar at once.
    if (open) setTimeout(() => document.dispatchEvent(new KeyboardEvent('keydown', { key: 'F', code: 'KeyF', metaKey: true, shiftKey: true, bubbles: true })), 250);
  } catch (e) { root = null; agtMsg('Did not load (no network?). The mockup works without it.'); console.info('Agentation did not load.', e); }
}
window.AGT = { set };
if (!shot) set(S.agt !== false); else agtMsg('');
</script>
