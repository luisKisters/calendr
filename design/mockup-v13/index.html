<!doctype html>
<html lang="en">
<head>

<title>Horion Overflow</title>
<!-- Horion v13 round 1: the time grid without the "+N" chip. -->
<style>
* { box-sizing: border-box; }

#stage { flex: 1; position: relative; overflow: hidden; }
.shot #picker { display: none; }

.pk-btn.on { background: #ececf0; color: #111; border-color: #ececf0; }

.pk-opt:hover { background: #1b1b1f; color: #eee; }

.pk-opt .hq:hover::after { content: attr(data-help); position: absolute; right: -4px; top: 22px; width: 270px; padding: 8px 10px; border-radius: 8px; background: #26262c; border: 1px solid #3a3a42; color: #e6e6ea; font-size: 11.5px; line-height: 1.45; white-space: normal; z-index: 10; }

/* ---------- preview: crossfade, short glow, alignment guides ---------- */
.ghost { pointer-events: none; z-index: 140; transition: opacity 140ms ease; }
.pvhl { animation: pvpulse 900ms ease-out forwards; }

/* ================= the app: week / day grid ================= */
@font-face { font-family: "Inter"; src: url("../mockup-v11/fonts/InterVariable.woff2") format("woff2"); font-weight: 100 900; }

  --font: "Inter", -apple-system, system-ui, sans-serif; --fs: 13px; --fs-ev: 12px; --fs-s: 11px; }
.desk.paper { --bg: #FBFBFB; --rail: #F4F4F5; --bg3: #DCDCDC; --hover: #F1F1F1; --selected: #EAEAEB; --hair: #E8E8E8; --grid: #E6E6E7; --grid2: #F0F0F1;
  --fg: #1D1D20; --fg2: #4A4A50; --fg3: #606067; --act: #1D1D20; --onact: #FBFBFB;
  --blue: #E3ECFB; --blueBar: #3E6FD8; --blueT: #1C2E52; --orange: #FBE9DC; --orangeBar: #D0651B; --orangeT: #57290A;
  --green: #DDF3E6; --greenBar: #23894C; --greenT: #0F3A22; --violet: #ECE5FA; --violetBar: #7A4FD0; --violetT: #2E1A57; }
.desk { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: var(--bg); color: var(--fg); font: var(--fs)/1.4 var(--font); display: flex; -webkit-font-smoothing: antialiased; }

.ev { position: absolute; border-radius: 4px; padding: 3px 6px 3px 11px; overflow: hidden; background: var(--fill); color: var(--tc); font-size: var(--fs-ev); line-height: 15px; text-align: left; display: flex; flex-direction: column; cursor: default; }
.ev::before { content: ""; position: absolute; left: 3px; top: 3px; bottom: 3px; width: 3px; border-radius: 1.5px; background: var(--bar); }

.ev.cut { box-shadow: -1px 0 0 var(--bg); }

.c-blue { --fill: var(--blue); --bar: var(--blueBar); --tc: var(--blueT); } .c-orange { --fill: var(--orange); --bar: var(--orangeBar); --tc: var(--orangeT); }
.c-green { --fill: var(--green); --bar: var(--greenBar); --tc: var(--greenT); } .c-violet { --fill: var(--violet); --bar: var(--violetBar); --tc: var(--violetT); }
.pn { position: absolute; height: 16px; padding: 0 5px; min-width: 22px; text-align: center; font: 600 10.5px/16px var(--font); background: var(--bg3); color: var(--fg); border-radius: 4px; box-shadow: 0 0 0 1.5px var(--bg); z-index: 70; }
.nowl { position: absolute; left: 0; right: 0; height: 0; border-top: 1.5px solid var(--now); z-index: 80; }

.ev.wrap { padding: 2px 3px 2px 8px; } .ev.wrap::before { left: 2px; top: 2px; bottom: 2px; width: 2.5px; }

.ev.wrap .m { display: none; }
.lbl { position: absolute; height: 17px; padding: 0 5px 0 9px; font-size: var(--fs-s); font-weight: 500; line-height: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--fill); color: var(--tc); border-radius: 4px 4px 4px 0; box-shadow: 0 0 0 1px var(--bg); }
.lbl::before { content: ""; position: absolute; left: 3px; top: 3px; bottom: 3px; width: 3px; border-radius: 1.5px; background: var(--bar); }
.lbl.un { background: var(--bg); color: var(--fg2); box-shadow: inset 0 0 0 1px var(--bar); }
.lane { position: absolute; width: 4px; border-radius: 2px; background: var(--bar); z-index: 12; }
.lane.un { background: none; box-shadow: inset 0 0 0 1px var(--bar); }
.lanebox { position: absolute; border-radius: 4px; background: var(--grid2); z-index: 10; }
.row { position: absolute; height: 16px; display: flex; gap: 5px; align-items: center; padding: 0 4px 0 9px; border-radius: 4px; background: var(--fill); color: var(--tc); font-size: var(--fs-s); line-height: 16px; white-space: nowrap; overflow: hidden; z-index: 14; }
.row::before { content: ""; position: absolute; left: 3px; top: 3px; bottom: 3px; width: 3px; border-radius: 1.5px; background: var(--bar); }
.row .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; min-width: 0; } .row .m { opacity: .7; flex: none; }
.row.un { background: var(--bg); color: var(--fg2); box-shadow: inset 0 0 0 1px var(--bar); } .row.sel { box-shadow: inset 0 0 0 1.5px var(--fg); }
</style>

<body>
<div id="root"><div id="stage"><div class="desk" id="desk"></div></div><aside id="picker"></aside></div>
<script>
// ================= edit for each round =================
const PRODUCT = 'Horion', VERSION = 'v13', ROUND = 2;
const DESK = { w: 1440, h: 900 };
const SCENES = [['week', 'Busy Wednesday, week'], ['day', 'Busy Wednesday, day'], ['light', 'Same week, Paper']];
const HOWTO = ['Wednesday has 8 events at 9–11 and 4 at 13–15. Today the app hides some behind "+N".', 'Hover an option to see it; click to pick. Click an event to bring it to the front.', 'Ink / Paper (bottom left) switches the theme.'];
const READ = 'Quiet tool UI: every event visible, titles readable first, no extra controls. Dials: variance 2, motion 2, density 7.';
const LOCKED = {};
const BEFORE = {};
const P = (v, l, h) => [v, l, h];
const DECISIONS = [
  { id: 'fit', name: 'Events that do not fit in the time grid', fb: 'i meant remove the n+ more in the day view like the actual events', note: 'Wednesday 9–11 and 13–15. Check the narrow week column first, then the day view.', scene: 'week', hl: '.col.busy .ev', opts: [
    P('lanes', 'Crowded spots: colour lanes + title list', 'Where today shows "+N" and side-by-side columns would be under 70 pt, each event becomes a thin colour lane at its real time on the left, and its title is listed next to it, one line each, in start order. Light overlaps look as today.'),
    P('widen', 'Side by side, and a busy day gets wider', 'Overlaps go in columns. In week view a day with many columns takes more width (up to 2.5×) and quiet days give it up, so every column keeps room for a readable title.'),
    P('wrap', 'Side by side, titles wrap', 'Overlaps go in columns of equal width. Narrow events drop the time and wrap the title over up to 4 lines in a smaller size.'),
    P('titles', 'Cascade, titles always on top', 'The smart cascade without a limit. Every title is drawn above all event bodies, so no title is covered, even when the bodies overlap.'),
    P('now', 'As now: "+N" chip (to compare)', 'Today: the 4th event and later go behind a "+N" chip that opens the stack panel.')] },
];
const SCENE_OF = {};

// ================= demo data =================
// Week of Mon 16 Nov 2026. day: 0 = Mon. Times in minutes. un = not accepted.
const EV = (day, s, e, title, c, un) => ({ id: `${day}-${s}-${title}`, day, s, e, title, c, un: !!un });
const H = (h, m = 0) => h * 60 + m;
function fresh() {
  return { sel: null, ev: [
    EV(0, H(9), H(9, 30), 'Standup', 'blue'), EV(0, H(10), H(11, 30), 'Focus: billing spec', 'violet'), EV(0, H(14), H(15), 'Design crit', 'orange'),
    EV(1, H(9), H(9, 30), 'Standup', 'blue'), EV(1, H(11), H(12), 'Customer call: Northwind', 'green'), EV(1, H(11, 30), H(12, 30), 'Lunch with Ana', 'orange'),
    // Wednesday: the crowded day.
    EV(2, H(9), H(10, 30), 'Design review: onboarding', 'blue'), EV(2, H(9), H(10), 'Standup', 'blue'), EV(2, H(9, 15), H(11), 'Hiring loop: frontend', 'green'),
    EV(2, H(9, 30), H(10, 15), 'Vendor call', 'orange'), EV(2, H(9, 30), H(9, 40), 'Check-in', 'violet'), EV(2, H(9, 45), H(10, 45), 'Roadmap prep', 'violet'),
    EV(2, H(10), H(10, 30), '1:1 with Mira', 'orange', true), EV(2, H(10), H(11), 'Offsite planning', 'green', true),
    EV(2, H(13), H(14), 'Team lunch', 'orange'), EV(2, H(13, 30), H(14, 30), 'Budget sync', 'blue'), EV(2, H(13, 45), H(15), 'Quarterly numbers', 'green'), EV(2, H(14), H(14, 30), 'Interview debrief', 'violet'),
    EV(2, H(16), H(17), 'Write-up', 'blue'),
    // Thursday: light overlaps, the locked look.
    EV(3, H(9), H(9, 30), 'Standup', 'blue'), EV(3, H(10), H(11), 'Planning', 'green'), EV(3, H(10, 15), H(11, 15), 'Sync with legal', 'orange'),
    EV(3, H(13), H(15), 'Workshop', 'violet'), EV(3, H(13, 45), H(14, 45), 'Pairing', 'blue'), EV(3, H(14), H(14, 10), 'Ping Sam', 'orange'),
    EV(4, H(9), H(9, 30), 'Standup', 'blue'), EV(4, H(11), H(12), 'Demo day prep', 'green', true), EV(4, H(11), H(11, 45), 'Review PRs', 'blue'), EV(4, H(15), H(16), 'Retro', 'orange'),
    EV(5, H(10), H(11), 'Run', 'green'),
  ] };
}

// ================= layout =================
const SHORT = 15, SPAN = 22, JOIN = 30, STEP = 14, UNL = 0.5, HEAD = 0.66;
// A port of HorionKit/OverlapV5.swift. mode: now (overflow to "+N"), cascade, split. Returns placements + "+N" groups.
function v5(items, mode) {
  const w = items.map((it, i) => ({ it, id: it.id, o: i, s: it.s, en: it.e - it.s <= SHORT ? it.s + SPAN : it.e, short: it.e - it.s <= SHORT, un: it.un, left: 0, width: 1, px: 0, level: 0, cut: false, grp: -1 }));
  w.sort((a, b) => a.s - b.s || (b.en - b.s) - (a.en - a.s) || a.o - b.o);
  const out = [], over = [], groups = [];
  const ov = (a, b) => a.s < b.en && a.en > b.s, cov = (o, i) => o.s <= i.s && o.en > i.s;
  const regroup = g => g.items.forEach((o, k) => { o.left = g.left + g.width * k / g.items.length; o.width = g.width / g.items.length; if (k > 0) o.cut = true; });
  for (const i of w.filter(x => !x.short && !x.un)) {
    const under = out.filter(o => ov(o, i));
    const crowded = under.filter(o => cov(o, i)).length >= 2;
    if (crowded && mode === 'now') { over.push(i); continue; }
    let host = under.filter(o => i.s - groups[o.grp].s < JOIN).pop();
    if (crowded && mode === 'split') host = under.filter(o => cov(o, i)).sort((a, b) => b.level - a.level || b.s - a.s)[0];
    if (host) {
      const g = groups[host.grp]; g.items.push(i);
      Object.assign(i, { grp: host.grp, level: host.level, px: host.px, cut: host.cut }); regroup(g); out.push(i); continue;
    }
    let top = null;
    for (const o of under) if (!top || o.level > top.level || (o.level === top.level && o.s > top.s)) top = o;
    if (top) Object.assign(i, { level: top.level + 1, left: groups[top.grp].left, px: top.px + STEP, cut: true });
    i.width = 1 - i.left; i.grp = groups.length; groups.push({ s: i.s, left: i.left, width: i.width, items: [i] }); out.push(i);
  }
  const right = [];
  for (const i of w.filter(x => !x.short && x.un)) {
    const hit = out.filter(o => ov(o, i));
    if (!hit.length) { Object.assign(i, { left: 0, width: 1 }); out.push(i); continue; }
    const r = right.filter(o => ov(o, i));
    if (r.length && mode === 'now') { over.push(i); continue; }
    for (const o of hit) if (Math.abs(i.s - o.s) < JOIN && o.left < UNL) o.width = Math.min(o.width, UNL - o.left);
    if (r.length && mode === 'split') { const g = r[0].rg; g.items.push(i); i.rg = g; regroup(g); Object.assign(i, { level: 8 }); out.push(i); continue; }
    Object.assign(i, { left: UNL, width: 1 - UNL, level: 8 + r.length, px: r.length ? Math.max(...r.map(o => o.px)) + STEP : 0, cut: true });
    i.rg = { left: UNL, width: 1 - UNL, items: [i] }; right.push(i); out.push(i);
  }
  const blocks = out.slice();
  for (const i of w.filter(x => x.short)) {
    if (blocks.filter(o => cov(o, i)).length >= 2 && mode === 'now') { over.push(i); continue; }
    const hit = blocks.some(o => ov(o, i)) || out.some(o => o.short && ov(o, i));

  desk.insertAdjacentHTML('beforeend', `<div id="guides">${out}<div class="legend"><b>Alignment guides</b> · G to hide<br>green: shared left edge (3+) · blue: shared right edge<br>red: ${misses.length} item${misses.length === 1 ? '' : 's'} 1 to 5 px off a line · ${cols} lines</div></div>`);
}

picker.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return;
  const a = t.dataset.a;
  if (t.dataset.scene) return preset(t.dataset.scene);
  if (t.dataset.d) { clearTimeout(PT); PV = null; S.c[t.dataset.d] = t.dataset.v; S.before = false; }
  else if (a === 'before' || a === 'after') S.before = a === 'before';
  else if (a === 'hover') S.hover = S.hover === false;
  else if (a === 'guides') S.guides = !S.guides;
  else if (a === 'agt') { S.agt = S.agt === false; save(); window.AGT?.set(S.agt, true); }
  else if (a === 'unlock') S.unlock = !S.unlock;
  else if (a === 'copy') { navigator.clipboard?.writeText(picksText()); t.textContent = 'Copied'; return; }
  else if (a === 'reset') { DECISIONS.forEach(d => { S.c[d.id] = d.lock ? LOCKED[d.id] : d.opts[0][0]; }); S.before = false; }
  else if (a === 'demo') A = fresh();
  else return;
  save(); renderPicker();
});
// Hover intent: show an option after 90 ms. The gaps inside one decision keep the preview, so nothing flickers.
let PT = null;
picker.addEventListener('mouseover', ev => {
  const o = ev.target.closest('.pk-opt[data-d]'), blk = ev.target.closest('.pk-dec');
  clearTimeout(PT);
  if (o) PT = setTimeout(() => previewOn(o.dataset.d, o.dataset.v), 90);
  else if (PV && blk && blk.querySelector(`[data-d="${PV.id}"]`)) return;
  else if (PV) PT = setTimeout(() => previewOff(), 140);
});
picker.addEventListener('mouseleave', () => { clearTimeout(PT); previewOff(); });
desk.addEventListener('click', ev => { const t = ev.target.closest('button'); if (t && appClick(t)) { save(); renderPicker(); } });
document.addEventListener('keydown', ev => {
  if (ev.target.closest?.('input, textarea') || ev.metaKey || ev.ctrlKey) return;
  if (ev.key === 'g' || ev.key === 'G') { S.guides = !S.guides; save(); renderPicker(); }
  else if ((ev.key === 'b' || ev.key === 'B') && Object.keys(BEFORE).length) { S.before = !S.before; save(); renderPicker(); }
});
window.addEventListener('resize', () => { fit(); drawGuides(); });
window.addEventListener('hashchange', () => { const id = location.hash.slice(1).split('&')[0]; if (id) preset(id); });
fit();
const scene0 = location.hash.slice(1).split('&')[0];
if (scene0 && SCENES.some(s => s[0] === scene0)) preset(scene0); else renderPicker();
document.fonts?.ready.then(() => { fit(); drawGuides(); });
</script>
<div id="agentation"></div>
<script type="module">
// Agentation (agentation.com): click any element, write a note. The picker toggle turns it on and off.
// It loads from esm.sh, so it needs the network. The mockup works without it. Its notes go into "Copy my picks".
const deps = '?deps=react@18.3.1,react-dom@18.3.1';
let lib = null, root = null;
async function set(on, open) {
  if (!on) { root?.unmount(); root = null; agtMsg('Off.'); return; }
  if (root) return;
  agtMsg('Loading from esm.sh …');
  try {
    lib = lib || await Promise.all([import('https://esm.sh/react@18.3.1'), import('https://esm.sh/react-dom@18.3.1/client' + deps), import('https://esm.sh/agentation@3.1.2' + deps)]);
    const [React, { createRoot }, { Agentation }] = lib;
    root = createRoot(document.getElementById('agentation'));
    root.render(React.createElement(Agentation, {
      appName: `${PRODUCT} ${VERSION} round ${ROUND}`, className: 'agt-host',
      identifyingAttributes: ['data-area', 'data-k', 'data-d', 'data-v', 'data-go', 'data-open'],
      onAnnotationAdd: NOTES.set, onAnnotationUpdate: NOTES.set, onAnnotationDelete: NOTES.del, onAnnotationsClear: NOTES.clear,
    }));
    agtMsg('On. ⌘⇧F or the button at the bottom right of the app opens it. Then click an element and write.');
    // After a click on the toggle, open the toolbar at once.
    if (open) setTimeout(() => document.dispatchEvent(new KeyboardEvent('keydown', { key: 'F', code: 'KeyF', metaKey: true, shiftKey: true, bubbles: true })), 250);
  } catch (e) { root = null; agtMsg('Did not load (no network?). The mockup works without it.'); console.info('Agentation did not load.', e); }
}
window.AGT = { set };
if (!shot) set(S.agt !== false); else agtMsg('');
</script>
