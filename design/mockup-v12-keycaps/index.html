<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendr keycaps</title>
<!-- designr starter. Replace the app part (tokens, demo data, app()). Keep the picker part. -->
<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #08080a; color: #d8d8dc; font: 13px/1.4 -apple-system, system-ui, sans-serif; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; padding: 0; }
input { font: inherit; color: inherit; background: none; border: 0; outline: 0; }
#root { display: flex; height: 100%; }
#stage { flex: 1; position: relative; overflow: hidden; }
.shot #picker { display: none; }

/* ---------- picker (outside the app) ---------- */
#picker { width: 380px; flex: none; border-left: 1px solid #222; background: #111113; overflow-y: auto; padding: 18px 18px 84px; }
#picker h1 { font-size: 15px; font-weight: 650; color: #f2f2f4; margin: 0; }
#picker h2 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: #6c6c74; font-weight: 600; margin: 22px 0 8px; }
#picker .lede { color: #8a8a92; font-size: 12px; margin: 4px 0 14px; }
.pk-btn { padding: 5px 9px; border-radius: 7px; background: #1b1b1f; color: #b4b4bb; font-size: 12px; border: 1px solid #26262b; }
.pk-btn:hover { background: #222227; color: #eee; }
.pk-btn.on { background: #ececf0; color: #111; border-color: #ececf0; }
.pk-scenes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.pk-notes { padding: 10px 12px; border-radius: 9px; background: #17171a; border: 1px solid #222226; color: #a6a6ae; font-size: 12px; }
.pk-notes ul { margin: 0; padding-left: 15px; }
.pk-ba { display: flex; gap: 4px; align-items: center; margin-bottom: 10px; }
.pk-ba span { color: #6c6c74; font-size: 11px; margin-left: 4px; }
.pk-tog { display: flex; gap: 8px; align-items: center; color: #a6a6ae; font-size: 12px; margin-top: 6px; }
.pk-tog i { width: 24px; height: 14px; border-radius: 7px; background: #2a2a30; position: relative; flex: none; }
.pk-tog i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 10px; height: 10px; border-radius: 50%; background: #8a8a92; transition: transform .15s; }
.pk-tog.on i { background: #ececf0; } .pk-tog.on i::after { transform: translateX(10px); background: #111; }
.pk-audit { margin-top: 8px; color: #8a8a92; font-size: 11.5px; }
.pk-audit b { color: #eee; }
.pk-dec { margin-bottom: 14px; }
.pk-dec > b { color: #f2f2f4; font-size: 12.5px; }
.pk-dec p { color: #8a8a92; font-size: 12px; margin: 3px 0 6px; }
.pk-new { color: #a6a6ae; font-size: 12px; margin: 3px 0 6px; }
.pk-new q { color: #e6e6ea; }
.pk-opt { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 8px; border-radius: 7px; color: #b4b4bb; font-size: 12px; }
.pk-opt:hover { background: #1b1b1f; color: #eee; }
.pk-opt.on { color: #f4f4f6; background: #1d1d22; }
.pk-opt .r { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #4a4a52; flex: none; }
.pk-opt.on .r { border-color: #f4f4f6; background: radial-gradient(#f4f4f6 0 2.5px, transparent 3px); }
.pk-opt .end { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.pk-opt .rec, .pk-opt .lk { font-size: 10.5px; color: #6c6c74; }
.pk-opt .hq { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #3a3a42; color: #8a8a92; font-size: 10px; display: inline-grid; place-items: center; position: relative; }
.pk-opt .hq:hover::after { content: attr(data-help); position: absolute; right: -4px; top: 22px; width: 270px; padding: 8px 10px; border-radius: 8px; background: #26262c; border: 1px solid #3a3a42; color: #e6e6ea; font-size: 11.5px; line-height: 1.45; white-space: normal; z-index: 10; }
.pk-lock { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 3px 0; color: #8a8a92; }
.pk-lock b { font-weight: 500; color: #c4c4cb; }
.pk-foot { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 22px; }
/* Agentation toolbar: bottom right of the app, not over the picker. */
.agt-host { right: 396px !important; bottom: 16px !important; }
#picker .read { color: #a6a6ae; font-size: 12px; margin: -6px 0 14px; padding-left: 10px; border-left: 2px solid #2a2a30; }
#picks { margin-top: 10px; width: 100%; height: 150px; background: #141417; color: #bdbdc4; border: 1px solid #25252a; border-radius: 8px; padding: 8px; font: 11px/1.45 ui-monospace, Menlo, monospace; resize: vertical; }

/* ---------- preview: crossfade, short glow, alignment guides ---------- */
.ghost { pointer-events: none; z-index: 140; transition: opacity 140ms ease; }
.pvhl { animation: pvpulse 900ms ease-out forwards; }
@keyframes pvpulse { 0% { box-shadow: 0 0 0 0 rgba(90,160,255,.9), 0 0 0 1.5px rgba(90,160,255,.9); } 60% { box-shadow: 0 0 0 8px rgba(90,160,255,0), 0 0 0 1.5px rgba(90,160,255,.9); } 100% { box-shadow: 0 0 0 8px rgba(90,160,255,0), 0 0 0 1.5px transparent; } }
#guides { position: absolute; inset: 0; pointer-events: none; z-index: 150; }
#guides .gv { position: absolute; width: 0; border-left: 1px solid rgba(64, 214, 120, .55); }
#guides .gv.r { border-left-color: rgba(90, 160, 255, .55); }
#guides .gv span { position: absolute; top: 2px; left: 2px; font: 9px ui-monospace, Menlo, monospace; color: rgba(64, 214, 120, .95); background: rgba(0,0,0,.6); padding: 0 2px; }
#guides .bx { position: absolute; outline: 1px solid rgba(255, 70, 90, .95); background: rgba(255, 70, 90, .12); }
#guides .bx span { position: absolute; top: -12px; left: 0; font: 9px ui-monospace, Menlo, monospace; color: #fff; background: rgba(220, 40, 60, .9); padding: 0 3px; white-space: nowrap; }
#guides .ol { position: absolute; outline: 1px dashed rgba(255, 255, 255, .14); }
#guides .legend { position: absolute; left: 12px; bottom: 12px; padding: 8px 10px; border-radius: 8px; background: rgba(10,10,12,.88); border: 1px solid rgba(255,255,255,.12); font: 11px/1.5 -apple-system, system-ui; color: #ddd; }

/* ================= the app: Calendr keycaps ================= */
@font-face { font-family: "Geist"; src: url("../mockup-v11/fonts/geist-latin.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist"; src: url("../mockup-v11/fonts/geist-latin-ext.woff2") format("woff2"); font-weight: 100 900; }
/* Tokens: design/design-system/foundations.md (round h, locked). Dark, then Paper. */
.desk { --bg: #0B0B0C; --rail: #070708; --surface: #151516; --raised: #1D1D1E; --hover: #161617; --hoverRail: #121213;
  --fg1: #EBEBED; --fg2: #CCCCCE; --fg3: #A8A8AA; --hair: #1C1C1D; --hairStrong: #2A2A2C; --searchEdge: #262628;
  --act: #EBEBED; --onAct: #0B0B0C; --actHover: #D6D6D8;
  /* keycap tokens, set per option below */
  --capEdge: #3A3A3C; --capFill: transparent; --capShadow: none; --capText: var(--fg3);
  --capOnFillEdge: rgba(11,11,12,.28); --capOnFillFill: transparent; --capOnFillText: rgba(11,11,12,.62);
  --font: "Geist", -apple-system, system-ui, sans-serif; --fs-t: 15px; --fs: 12px; --fs-s: 11px; }
.desk.paper { --bg: #FBFBFB; --rail: #F4F4F5; --surface: #F1F1F2; --raised: #FFFFFF; --hover: #F1F1F1; --hoverRail: #EDEDEE;
  --fg1: #1D1D20; --fg2: #4A4A50; --fg3: #606067; --hair: #E8E8E8; --hairStrong: #DCDCDC; --searchEdge: #E1E1E2;
  --act: #1D1D20; --onAct: #FBFBFB; --actHover: #34343A;
  --capEdge: #D2D2D4; --capOnFillEdge: rgba(251,251,251,.32); --capOnFillText: rgba(251,251,251,.7); }

/* Look */
.desk.look-keyface { --capFill: var(--raised); }
.desk.look-keyface.paper { --capFill: #FFFFFF; }
.desk.look-key { --capFill: var(--raised); --capShadow: inset 0 -1px 0 var(--capEdge); }
.desk.look-key.paper { --capFill: #FFFFFF; }
.desk.look-tint { --capEdge: transparent; --capFill: #232325; }
.desk.look-tint.paper { --capFill: #E9E9EA; }
.desk.look-bare { --capEdge: transparent; }
/* On a filled button */
.desk.onfill-tint { --capOnFillEdge: transparent; --capOnFillFill: rgba(11,11,12,.09); }
.desk.onfill-tint.paper { --capOnFillFill: rgba(251,251,251,.16); }
.desk.onfill-bare { --capOnFillEdge: transparent; }

.desk { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: var(--bg); color: var(--fg1);
  font: var(--fs)/18px var(--font); letter-spacing: .005em; -webkit-font-smoothing: antialiased; font-feature-settings: "tnum"; }
.wall { position: absolute; inset: 0; padding: 28px 32px; display: grid; grid-template-columns: 620px 1fr; gap: 28px 40px; align-content: start; }
.col { display: flex; flex-direction: column; gap: 28px; }
.cap { font: 500 10.5px/14px -apple-system, system-ui; color: #6c6c74; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; }
.paper .cap { color: #8a8a92; }

/* the cap */
.kbd { display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; height: 16px; min-width: 16px; padding: 0 4px;
  border-radius: 4px; border: 1px solid var(--capEdge); background: var(--capFill); box-shadow: var(--capShadow);
  color: var(--capText); font: 400 var(--fs-s)/1 var(--font); font-style: normal; letter-spacing: 0; white-space: nowrap; transition: background 80ms, color 80ms; }
.kbd svg { width: 10px; height: 10px; display: block; }
.look-bare .kbd { padding: 0; min-width: 0; height: auto; }
.kbdc { display: inline-flex; gap: 3px; align-items: center; }
.look-bare .kbdc { gap: 3px; }
.kbd.down { background: var(--fg3); color: var(--bg); border-color: var(--fg3); }
.fill .kbd { border-color: var(--capOnFillEdge); background: var(--capOnFillFill); color: var(--capOnFillText); box-shadow: none; }
.onfill-bare .fill .kbd { padding: 0; min-width: 0; }
.fill .kbd.down { background: var(--onAct); color: var(--act); }

/* controls (Components.swift: 32 pt, radius 8, 12 / 500) */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; font-weight: 500; color: var(--fg1); }
.btn.line { border: 1px solid var(--hairStrong); }
.btn.line:hover { background: var(--hover); }
.btn.fill { background: var(--act); color: var(--onAct); font-weight: 600; padding: 0 10px 0 12px; }
.btn.fill:hover { background: var(--actHover); }
.btn.ghost { color: var(--fg2); }
.btn.ghost:hover { background: var(--hoverRail); color: var(--fg1); }

.sheet { width: 400px; padding: 20px 20px 20px 24px; border-radius: 12px; background: var(--surface); border: 1px solid var(--hairStrong); box-shadow: 0 18px 50px rgba(0,0,0,.45); }
.paper .sheet { box-shadow: 0 18px 50px rgba(0,0,0,.12); background: #FFFFFF; }
.sheet h3 { margin: 0; font-size: var(--fs-t); line-height: 21px; font-weight: 600; }
.sheet p { margin: 12px 0 0; color: var(--fg2); }
.sheet .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

.foot { width: 320px; background: var(--rail); border-top: 1px solid var(--hair); padding: 10px 12px; display: flex; justify-content: flex-end; gap: 4px; border-radius: 0 0 0 0; }

.toast { display: inline-flex; align-items: center; gap: 10px; height: 38px; padding: 0 6px 0 14px; border-radius: 19px; background: var(--raised); border: 1px solid var(--hairStrong); }
.toast .undo { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 5px 0 9px; border-radius: 13px; font-weight: 600; }
.toast .undo:hover { background: var(--hover); }
.toast .x { width: 22px; height: 22px; display: grid; place-items: center; color: var(--fg3); }

.search { width: 296px; height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; border-radius: 8px; background: var(--raised); border: 1px solid var(--searchEdge); color: var(--fg3); }
.search input { flex: 1; color: var(--fg1); font: inherit; } .search input::placeholder { color: var(--fg3); }

.side { width: 236px; background: var(--rail); border: 1px solid var(--hair); border-radius: 10px; padding: 8px 12px; }
.side .row { display: flex; align-items: center; height: 28px; padding: 0 8px; margin: 0 -8px; border-radius: 6px; color: var(--fg2); width: calc(100% + 16px); }
.side .row:hover { background: var(--hoverRail); color: var(--fg1); }
.side .row .kbdc { margin-left: auto; }

.cmd { width: 620px; border-radius: 12px; background: var(--surface); border: 1px solid var(--hairStrong); overflow: hidden; }
.paper .cmd { background: #FFFFFF; }
.cmd .q { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-bottom: 1px solid var(--hair); color: var(--fg3); }
.cmd .q input { flex: 1; font: inherit; font-size: 13px; color: var(--fg1); } .cmd .q input::placeholder { color: var(--fg3); }
.cmd .list { padding: 6px; }
.cmd .lab { padding: 5px 10px; font-weight: 500; color: var(--fg3); }
.cmd .it { display: flex; align-items: center; gap: 12px; height: 32px; padding: 0 12px; border-radius: 6px; width: 100%; }
.cmd .it.on, .cmd .it:hover { background: var(--hover); }
.ico { width: 16px; height: 16px; color: var(--fg3); flex: none; }
.cmd .it .kbdc { margin-left: auto; }
.cmd .hints { display: flex; align-items: center; gap: 16px; height: 36px; padding: 0 16px; border-top: 1px solid var(--hair); color: var(--fg3); font-size: var(--fs-s); }
.cmd .hints .h { display: inline-flex; align-items: center; gap: 6px; }
.cmd .hints .sp { flex: 1; }

.short { width: 380px; }
.short .lab { font-weight: 500; color: var(--fg3); padding-bottom: 6px; }
.short .r { display: flex; align-items: center; height: 30px; border-top: 1px solid var(--hair); }
.short .r > span:first-child { flex: 1; }
.short .r .ks { display: inline-flex; gap: 11px; }

.call { width: 320px; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--rail); border: 1px solid var(--hair); }
.call .t { flex: 1; color: var(--fg2); } .call .t b { color: var(--fg1); font-weight: 500; display: block; }

.empty { text-align: center; padding: 26px 0; border: 1px dashed var(--hair); border-radius: 10px; width: 620px; }
.empty b { display: block; font-size: var(--fs-t); line-height: 21px; font-weight: 600; margin-bottom: 6px; }
.empty .l { display: inline-flex; align-items: center; gap: 5px; color: var(--fg3); }

/* close-up */
.zoom { position: absolute; left: 32px; top: 28px; transform: scale(3); transform-origin: 0 0; display: grid; gap: 14px; }
.zoom .z { display: flex; gap: 10px; align-items: center; }

/* design system sheet */
.ds { position: absolute; inset: 28px 32px auto; display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
.ds table { border-collapse: collapse; width: 100%; }
.ds td { height: 30px; border-top: 1px solid var(--hair); padding-right: 12px; color: var(--fg2); }
.ds td:first-child { color: var(--fg1); width: 170px; }
.ds td.v { font-feature-settings: "tnum"; }
.ds .g { display: grid; grid-template-columns: repeat(6, auto); gap: 10px 18px; justify-content: start; align-items: center; color: var(--fg3); }
.ds .g div { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; font-size: var(--fs-s); }
</style>
</head>
<body>
<div id="root"><div id="stage"><div class="desk" id="desk"></div></div><aside id="picker"></aside></div>
<script>
// ================= edit for each round =================
const PRODUCT = 'Calendr', VERSION = 'v12 keycaps', ROUND = 1;
const DESK = { w: 1440, h: 900 };            // the real window size
const SCENES = [['all', 'Everywhere · Dark'], ['paper', 'Everywhere · Paper'], ['zoom', 'Close-up 3×'], ['system', 'Design system']];
const HOWTO = ['Every keycap the app draws today, at real size, with the v11 tokens.', 'Press the keys (↩, esc, /, C, ⌫, arrows, ⌘, ⌥, ⇧) and the matching caps light up.', 'Keys: G alignment guides.', 'Notes on one element: turn on Agentation below, click the element, write. "Copy my picks" takes the notes.'];
const READ = 'Read: a quiet native Mac calendar for keyboard people. Caps are wayfinding: present on every control that has a key, never louder than the label. Dials: VARIANCE 2 · MOTION 2 · DENSITY 6.';
const LOCKED = {};
const BEFORE = {};
const DECISIONS = [
  { g: 'Round 1', id: 'look', name: 'Keycap look',
    fb: 'i think having like an outline thing around it perhaps would be nice lets generally better define how we have kbds',
    note: 'Everywhere: the dialog, the editor foot, the toast, search, the command menu, the shortcuts sheet, the sidebar foot. Close-up shows them at 3×.',
    scene: 'all', hl: '.kbd', opts: [
    ['line', 'Outline: 1 px edge, no fill', '16 pt tall, at least 16 wide, 4 pt padding, radius 4, a 1 px edge (bg → fg1 at about 18 %), the glyph in fg3 11 / 400. It reads as a key on every surface without adding a fill.'],
    ['keyface', 'Outline + raised fill', 'The same cap filled with raised (#1D1D1E / white). It stands out a bit more, mostly on the rail and the canvas.'],
    ['key', 'Physical key: fill, edge, heavier bottom', 'Raised fill and edge plus a 1 px inner line at the bottom, like a real key (Linear, Raycast). The most "key-like"; also the busiest.'],
    ['tint', 'Fill only, no edge', 'A soft grey fill and no line. Calm, but on cards and in the toast it nearly vanishes.'],
    ['bare', 'Bare glyph (now)', 'What the app draws today: the glyph alone in fg3.'],
  ] },
  { g: 'Round 1', id: 'onfill', name: 'Keycap on a filled button',
    note: 'This event ↩ in the dialog, Save ↩ in the editor foot.', scene: 'all', hl: '.fill .kbd', opts: [
    ['line', 'Outline in the button ink', 'The same cap shape, its edge and glyph in the button text colour at about 30 % and 62 %. It matches the caps elsewhere.'],
    ['tint', 'Soft fill in the button ink', 'No edge, a 9 % fill of the button text colour.'],
    ['bare', 'Bare glyph (now)', 'The glyph alone at 60 %.'],
  ] },
  { g: 'Round 1', id: 'group', name: 'Shortcuts with a modifier',
    note: 'Undo ⌘ Z in the toast, ⌘ , in the sidebar, the command-menu rows, the shortcuts sheet.', scene: 'all', hl: '.kbdc', opts: [
    ['each', 'One cap per key, 3 pt apart', '⌘ and Z each get their own cap, as on the keyboard and in the macOS menus’ spirit. Today the app mixes both (⌘ , apart, ⌘J together).'],
    ['one', 'One cap per shortcut', '⌘Z in a single cap. Shorter rows, fewer boxes.'],
  ] },
];

// ================= demo data (invent all of it) =================
function fresh() { return { toast: 'Event deleted', sel: 0, q: '' }; }

// ================= the app =================
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const RET = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3v5.2a1.6 1.6 0 0 1-1.6 1.6H3.5"/><path d="M6.4 6.8 3.4 9.8l3 3"/></svg>';
const glyph = k => (k === '↩' ? RET : esc(k));
const cap = k => `<i class="kbd" data-key="${esc(k)}">${glyph(k)}</i>`;
// One shortcut. Keys: ['⌘', 'Z']. "One cap per shortcut" joins them.
function kb(...keys) {
  if (C('group') === 'one' && keys.length > 1 && keys.every(k => k !== '↩')) return `<span class="kbdc">${cap(keys.join(''))}</span>`.replace(`data-key="${esc(keys.join(''))}"`, `data-key="${esc(keys.join(' '))}"`);
  return `<span class="kbdc">${keys.map(cap).join('')}</span>`;
}
const ICON = '<svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="3" width="11" height="10.5" rx="2"/><path d="M2.5 6.5h11"/></svg>';
function deskClass() { return `look-${C('look')} onfill-${C('onfill')} group-${C('group')} ${S.scene === 'paper' ? 'paper' : ''}`; }

function wall() {
  const cmdRows = [['New event', ['C']], ['Go to today', ['T']], ['Join the next call', ['⌘', 'J']], ['Settings', ['⌘', ',']]];
  const left = `
  <div><div class="cap" data-os>Command menu (⌘ K)</div>
    <div class="cmd" data-area="menu"><div class="q">${ICON}<input data-k="q" placeholder="Type a command or search events…" value="${esc(A.q)}">${kb('esc')}</div>
      <div class="list"><div class="lab">Commands</div>${cmdRows.map(([t, k], i) => `<button class="it ${A.sel === i ? 'on' : ''}" data-sel="${i}">${ICON}${t}${kb(...k)}</button>`).join('')}</div>
      <div class="hints"><span class="h">${kb('↩')}Run</span><span class="h">${kb('↑', '↓')}Move</span><span class="h">${kb('⌫')}Back</span><span class="sp"></span><span class="h">${kb('esc')}Close</span></div></div></div>
  <div><div class="cap" data-os>Empty week</div>
    <div class="empty" data-area="grid"><b>Nothing this week</b><span class="l">Drag on the grid, or press ${cap('C')} for a new event.</span></div></div>
  <div><div class="cap" data-os>Keyboard shortcuts (?) · one column</div>
    <div class="short" data-area="sheet"><div class="lab">Events</div>
      ${[['New event at the next free slot', [['C']]], ['Select next, previous event', [['⇥'], ['⇧', '⇥']]], ['Edit the title', [['↩']]], ['Move by 15 minutes', [['⌥', '↑'], ['⌥', '↓']]], ['Delete', [['⌫']]], ['Undo', [['⌘', 'Z']]]]
        .map(([t, ks]) => `<div class="r"><span>${t}</span><span class="ks">${ks.map(k => kb(...k)).join('')}</span></div>`).join('')}</div></div>`;
  const right = `
  <div><div class="cap" data-os>Delete recurring event</div>
    <div class="sheet" data-area="dialog"><h3>Delete recurring event</h3><p>This event repeats. Which events should be deleted?</p>
