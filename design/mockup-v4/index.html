<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendr v4 mockup (interactive)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- <link rel="preconnect" href="https://fonts.googleapis.com"> -->
<!-- <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"> -->
<style>
@font-face { font-family: "Instrument Sans"; src: url("../../Sources/Calendr/Resources/Fonts/InstrumentSans.ttf"); font-weight: 400 700; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #08080a; color: #d8d8dc; font: 13px/1.4 -apple-system, "SF Pro Text", system-ui, sans-serif; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; }
input, textarea { font: inherit; color: inherit; background: none; border: 0; outline: 0; }
#page { display: flex; height: 100vh; }
#stage { flex: 1; position: relative; overflow: hidden; }
#frame { position: absolute; left: 50%; top: 50%; width: 1440px; height: 928px; transform-origin: 0 0; border-radius: 12px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08); }

/* ---------- picker (outside the app) ---------- */
#picker { width: 380px; flex: none; border-left: 1px solid #222; background: #111113; overflow-y: auto; padding: 18px 18px 40px; }
#picker h1 { font-size: 15px; font-weight: 650; color: #f2f2f4; letter-spacing: -.01em; }
#picker .lede { color: #8a8a92; font-size: 12px; margin: 4px 0 14px; }
#picker h2 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: #6c6c74; font-weight: 600; margin: 22px 0 8px; }
.pk-btn { padding: 5px 9px; border-radius: 7px; background: #1b1b1f; color: #b4b4bb; font-size: 12px; border: 1px solid #26262b; text-align: left; }
.pk-btn:hover { background: #222227; color: #eee; }
.pk-btn.on { background: #ececf0; color: #111; border-color: #ececf0; }
.pk-scenes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.pk-scenes .pk-btn { font-size: 11.5px; }
.pk-notes { margin-top: 10px; padding: 10px 12px; border-radius: 9px; background: #17171a; border: 1px solid #222226; color: #a6a6ae; font-size: 12px; }
.pk-notes li { margin-left: 15px; margin-top: 3px; }
.pk-dec { padding: 10px 0; border-top: 1px solid #1d1d21; }
.pk-dec b { display: block; font-size: 12.5px; color: #e6e6ea; font-weight: 600; margin-bottom: 2px; }
.pk-dec p { font-size: 11.5px; color: #7c7c85; margin-bottom: 7px; }
.pk-opt { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 8px; border-radius: 7px; color: #a9a9b1; font-size: 12px; text-align: left; }
.pk-opt:hover { background: #1b1b1f; color: #eee; }
.pk-opt .r { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #55555d; flex: none; }
.pk-opt.on { color: #f4f4f6; background: #1d1d22; }
.pk-opt.on .r { border-color: #f4f4f6; background: radial-gradient(#f4f4f6 0 3px, transparent 3.5px); }
.pk-opt .rec { margin-left: auto; font-size: 10px; color: #6fbf8a; letter-spacing: .03em; }
.pk-pal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.pk-sw { border-radius: 9px; padding: 7px 8px 6px; border: 1.5px solid transparent; text-align: left; position: relative; }
.pk-sw.on { border-color: #f4f4f6; box-shadow: 0 0 0 1px #000; }
.pk-sw .bars { display: flex; gap: 3px; margin-bottom: 6px; }
.pk-sw .bars i { height: 14px; border-radius: 3px; flex: 1; }
.pk-sw span { font-size: 10.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pk-acc { display: flex; flex-wrap: wrap; gap: 6px; }
.pk-acc button { display: flex; align-items: center; gap: 6px; padding: 4px 9px 4px 6px; border-radius: 14px; border: 1px solid #26262b; font-size: 11.5px; color: #b4b4bb; }
.pk-acc button i { width: 13px; height: 13px; border-radius: 50%; }
.pk-acc button.on { border-color: #f4f4f6; color: #fff; }
.pk-icons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pk-icons button { border-radius: 10px; padding: 6px 2px 4px; border: 1.5px solid transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: #9a9aa2; }
.pk-icons button.on { border-color: #f4f4f6; color: #fff; }
.pk-foot { margin-top: 18px; display: flex; gap: 6px; flex-wrap: wrap; }
#picks { margin-top: 10px; width: 100%; height: 170px; background: #141417; color: #bdbdc4; border: 1px solid #25252a; border-radius: 8px; padding: 8px; font: 11px/1.45 ui-monospace, Menlo, monospace; resize: vertical; }

/* ---------- desktop and tokens ---------- */
.desk { position: relative; width: 1440px; height: 928px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: var(--fs-ui); -webkit-font-smoothing: antialiased; }
.f-sfinst { --font: -apple-system, "SF Pro Text", system-ui, sans-serif; --head: "Instrument Sans", -apple-system, sans-serif; }
.f-sf { --font: -apple-system, "SF Pro Text", system-ui, sans-serif; --head: -apple-system, "SF Pro Display", system-ui, sans-serif; }
/* .f-inter { --font: Inter, -apple-system, sans-serif; --head: Inter, -apple-system, sans-serif; } */
.f-inst { --font: "Instrument Sans", -apple-system, sans-serif; --head: "Instrument Sans", -apple-system, sans-serif; }
.f-geist { --font: Geist, -apple-system, sans-serif; --head: Geist, -apple-system, sans-serif; }
.f-dm { --font: "DM Sans", -apple-system, sans-serif; --head: "DM Sans", -apple-system, sans-serif; }
.f-fig { --font: Figtree, -apple-system, sans-serif; --head: Figtree, -apple-system, sans-serif; }
.f-plex { --font: "IBM Plex Sans", -apple-system, sans-serif; --head: "IBM Plex Sans", -apple-system, sans-serif; }
.f-man { --font: Manrope, -apple-system, sans-serif; --head: Manrope, -apple-system, sans-serif; }
.s-xs  { --fs-ev: 10.5px; --fs-evt: 9.5px; --fs-ui: 12px; --fs-meta: 11px; --fs-pill: 10px; }
.s-xs2 { --fs-ev: 11px; --fs-evt: 10px; --fs-ui: 12.5px; --fs-meta: 11.5px; --fs-pill: 10.5px; }
.s-s   { --fs-ev: 11.5px; --fs-evt: 10.5px; --fs-ui: 12.5px; --fs-meta: 11.5px; --fs-pill: 11px; }
.s-m   { --fs-ev: 12.5px; --fs-evt: 11.5px; --fs-ui: 13px; --fs-meta: 12px; --fs-pill: 12px; }
.s-l   { --fs-ev: 13px; --fs-evt: 12px; --fs-ui: 13.5px; --fs-meta: 12.5px; --fs-pill: 12.5px; }
.tab { font-variant-numeric: tabular-nums; }
.ic { display: inline-block; flex: none; vertical-align: middle; }

/* macOS menu bar */
.macbar { height: 28px; display: flex; align-items: center; gap: 18px; padding: 0 14px; font: 13px -apple-system, system-ui; color: #f4f4f4; background: linear-gradient(#3a3d48, #2f323b); position: relative; z-index: 30; }
.light .macbar { background: linear-gradient(#e9e6df, #dedad2); color: #111; }
.macbar .sp { flex: 1; }
.macbar .si { display: flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 5px; }
.macbar .si:hover, .macbar .si.on { background: rgba(255,255,255,.18); }
.light .macbar .si:hover, .light .macbar .si.on { background: rgba(0,0,0,.1); }

/* window */
.win { position: absolute; top: 28px; left: 0; right: 0; bottom: 0; display: flex; background: var(--bg); }
.side { width: 236px; flex: none; background: var(--bg1); border-right: 1px solid var(--hair); padding: 12px 12px 10px; display: flex; flex-direction: column; }
.wtop { display: flex; align-items: center; height: 26px; margin-bottom: 14px; padding-right: 4px; }
.lights { display: flex; gap: 8px; margin-left: 4px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
.lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.wtop .sp { flex: 1; }
.mm-h { display: flex; justify-content: space-between; align-items: center; padding: 0 4px 8px; font-weight: 600; font-size: var(--fs-ui); }
.mm-h span { color: var(--fg3); font-weight: 400; }
.mm { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; font-size: 11.5px; text-align: center; margin-bottom: 8px; padding: 0 4px; }
.mm .wd { color: var(--fg3); font-size: 10px; font-weight: 500; padding-bottom: 4px; }
.mm .d { height: 26px; line-height: 26px; color: var(--fg2); border-radius: 50%; }
.mm .d.o { color: var(--fg3); opacity: .55; }
.mm .wk { background: var(--hover); border-radius: 0; }
.mm .wk.first { border-radius: 7px 0 0 7px; } .mm .wk.last { border-radius: 0 7px 7px 0; }
.mm .d.today { background: var(--today); color: var(--ontoday); font-weight: 600; border-radius: 7px; }
.calscroll { flex: 1; overflow-y: auto; margin-right: -6px; padding-right: 6px; scrollbar-width: none; }
.acct { display: flex; align-items: center; font-size: 10.5px; color: var(--fg3); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; margin: 16px 0 4px; padding: 0 4px; height: 22px; }
.acct span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct .hb, .cal .hb { opacity: 0; }
.acct:hover .hb, .cal:hover .hb, .hb.on { opacity: 1; }
.cal { display: flex; align-items: center; gap: 10px; height: 28px; padding: 0 4px; font-size: var(--fs-meta); color: var(--fg); border-radius: 7px; }
.cal:hover { background: var(--hover); }
.cal .cb { width: 14px; height: 14px; border-radius: 4px; background: var(--cc); display: grid; place-items: center; flex: none; }
.cal.off .cb { background: none; box-shadow: inset 0 0 0 1.5px var(--cc); }
.cal.off .nm { color: var(--fg3); }
.cal .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: default; }
.addrow { display: flex; align-items: center; gap: 10px; height: 28px; padding: 0 4px; color: var(--fg3); font-size: var(--fs-meta); border-radius: 7px; width: 100%; margin-top: 8px; }
.addrow:hover { background: var(--hover); color: var(--fg); }
.side .foot { color: var(--fg2); display: flex; gap: 10px; align-items: center; padding: 6px 4px; font-size: var(--fs-meta); border-radius: 7px; width: 100%; }
.side .foot:hover { background: var(--hover); color: var(--fg); }

.center { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.hdr { height: 60px; flex: none; display: flex; align-items: center; padding: 0 16px 0 20px; gap: 14px; }
.hdr h2 { font-family: var(--head); font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
.hdr h2 span { color: var(--fg3); font-weight: 500; }
.hdr .wkno { color: var(--fg3); font-size: var(--fs-meta); }
.hdr .sp { flex: 1; }
.tabs { display: flex; gap: 14px; font-size: var(--fs-meta); color: var(--fg3); }
.tabs button:hover { color: var(--fg); }
.tabs .on { color: var(--fg); font-weight: 600; box-shadow: inset 0 -1.5px var(--fg); padding-bottom: 3px; }
.nav { display: flex; align-items: center; gap: 2px; font-size: var(--fs-meta); }
.ibtn { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: var(--fg2); flex: none; }
.ibtn:hover, .ibtn.on { background: var(--hover); color: var(--fg); }
.btn-line { height: 26px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--hair2); font-size: var(--fs-meta); display: inline-flex; align-items: center; gap: 6px; }
.btn-line:hover { background: var(--hover); }
.mchip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 4px 0 8px; border-radius: 13px; background: var(--bg2); font-size: var(--fs-meta); }

.dh { display: flex; height: 38px; flex: none; border-bottom: 1px solid var(--hair); }
.dh .g { width: 58px; flex: none; }
.dh .c { flex: 1; display: flex; align-items: center; justify-content: flex-start; padding-left: 12px; gap: 6px; font-size: var(--fs-meta); color: var(--fg2); }
.dh .c.past { color: var(--fg3); }
.dh .c .n { font-weight: 600; }
.dh .c.today { color: var(--fg); font-weight: 600; }
.dh .c.today .n { background: var(--today); color: var(--ontoday); border-radius: 6px; padding: 1px 6px; }

/* all-day */
.ad { display: flex; flex: none; border-bottom: 1px solid var(--hair2); position: relative; }
.ad .g { width: 58px; flex: none; display: flex; flex-direction: column; align-items: center; padding-top: 5px; gap: 2px; }
.ad .g .lbl { font-size: 10px; color: var(--fg3); letter-spacing: .02em; }
.ad .g .tog { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: var(--fg2); }
.ad .g .tog:hover { background: var(--hover); color: var(--fg); }
.ad .body { flex: 1; position: relative; overflow-y: auto; scrollbar-width: thin; }
.ad .grid7 { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: var(--adh); row-gap: 3px; padding: 4px 0 5px; position: relative; min-height: 100%; }
.ad .cols { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, 1fr); pointer-events: none; }
.ad .cols i { border-left: 1px solid var(--hair); }
.adi { margin: 0 3px 0 2px; height: var(--adh); border-radius: 5px; padding: 0 7px 0 10px; display: flex; align-items: center; font-size: var(--fs-pill); font-weight: var(--ev-w); white-space: nowrap; overflow: hidden; background: var(--fill); color: var(--tc); position: relative; z-index: 1; text-align: left; }
.adi::before { content: ""; position: absolute; left: 3px; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; background: var(--bar); }
.adi.past::before { background: var(--barp); }
.adi.task::before { display: none; }
.adi span { overflow: hidden; text-overflow: ellipsis; }
.adi.past { color: var(--tcp); background: var(--fillp); opacity: var(--pastop); }
.adi.task { --fill: var(--pillbg); --tc: var(--fg); padding-left: 8px; }
.adi.task.past { --fillp: var(--pillbgp); --tcp: var(--fg3); }
.adi.sel { box-shadow: 0 0 0 1.5px var(--bg), 0 0 0 3px var(--fg); }
.ad .more { font-size: var(--fs-meta); color: var(--fg2); padding: 0 8px 0 10px; display: flex; align-items: center; border-radius: 5px; margin: 0 3px 0 2px; position: relative; z-index: 1; }
.ad .more:hover { background: var(--hover); color: var(--fg); }
.ad .cnt { font-size: var(--fs-meta); color: var(--fg2); padding: 0 10px; display: flex; align-items: center; height: 28px; position: relative; z-index: 1; }
.ad .cnt:hover { color: var(--fg); }
.kbd { display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 4px; background: var(--bg3); color: var(--fg2); font-size: 11px; font-weight: 500; font-style: normal; }

/* grid */
.gridwrap { flex: 1; overflow-y: auto; position: relative; scrollbar-width: none; }
.gridwrap::-webkit-scrollbar { display: none; }
.grid { position: relative; display: flex; }
.gut { width: 58px; flex: none; position: relative; }
.gut .h { position: absolute; right: 8px; transform: translateY(-50%); font-size: 10.5px; color: var(--fg3); }
.gut .now { position: absolute; right: 4px; transform: translateY(-50%); font-size: 10.5px; color: #fff; background: var(--live); border-radius: 5px; padding: 1px 5px; font-weight: 600; }
.days { flex: 1; display: flex; position: relative; }
.day { flex: 1; position: relative; border-left: 1px solid var(--hair); transition: flex-grow .26s cubic-bezier(.22,.61,.36,1); }
.day.wide, .dh .c.wide { flex-grow: 2.5; }
.dh .c { transition: flex-grow .26s cubic-bezier(.22,.61,.36,1); }
.hl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--hair); pointer-events: none; }
.nowl { position: absolute; left: 0; right: 0; border-top: 1px solid color-mix(in srgb, var(--live) 35%, transparent); z-index: 6; pointer-events: none; }
.nowl.today { border-top: 2px solid var(--live); margin-top: -.5px; }
.nowl.today::before { content: ""; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--live); }

.ev { position: absolute; border-radius: 6px; padding: 4px 7px 4px 10px; overflow: hidden; background: var(--fill); color: var(--tc); font-size: var(--fs-ev); line-height: 1.25; text-align: left; cursor: default; display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; }
.ev::before { content: ""; position: absolute; left: 3px; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; background: var(--bar); }
.ev:hover { filter: brightness(1.12); }
.light .ev:hover { filter: brightness(.97); }
.ev .t { font-weight: var(--ev-w); overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: break-word; hyphens: auto; flex: none; }
/* narrow blocks (under 72 px): the title on one line with an ellipsis, never split inside a word */
.ev.narrow .t { display: block; white-space: nowrap; text-overflow: ellipsis; }
.ev.narrow .m { text-overflow: clip; }
.ev .m { color: var(--mc); font-size: var(--fs-evt); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev.one { flex-direction: row; gap: 4px; align-items: flex-start; padding-top: 3px; padding-bottom: 0; white-space: nowrap; }
.ev.one.xs { align-items: center; padding-top: 0; }
.ev.one { padding-right: 5px; }
/* a narrow one-line block keeps its title; its position already says the time */
.ev.one.narrow .m { display: none; }
.ev.cmp { padding-top: 2px; } .ev.cmp .m { margin-top: 0; }
/* blocks under 52 px keep the title to one line, so the time below always shows */
.ev.t1 .t { -webkit-line-clamp: 1; hyphens: manual; }
.ev.one .t { flex: 0 1 auto; min-width: 0; display: block; -webkit-line-clamp: none; text-overflow: ellipsis; white-space: nowrap; }
.ev.one .m { margin: 0; flex: none; }
.ev.past { background: var(--fillp); color: var(--tcp); opacity: var(--pastop); }
.ev.past::before { background: var(--barp); }
.ev.past .m { color: var(--mcp); }
.ev.cut { box-shadow: 0 0 0 1.5px var(--bg); }
.ev.sel { box-shadow: 0 0 0 1.5px var(--bg), 0 0 0 3px var(--fg); z-index: 8 !important; opacity: 1; }
.ev.draft { background: color-mix(in srgb, var(--fill) 60%, transparent); outline: 1.5px dashed var(--fg2); outline-offset: -1.5px; color: var(--fg); }
.pill { position: absolute; height: 18px; border-radius: 9px; padding: 0 8px 0 9px; display: flex; align-items: center; gap: 6px; font-size: var(--fs-pill); font-weight: var(--ev-w); white-space: nowrap; overflow: hidden; background: var(--pillbg); color: var(--fg); box-shadow: inset 2.5px 0 var(--bar), 0 0 0 1.5px var(--bg); z-index: 3; text-align: left; }
.pill .t { overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
.pill .m { color: var(--fg2); font-weight: 400; flex: 0 100 auto; min-width: 0; overflow: hidden; font-size: var(--fs-evt); }
.pill.past { color: var(--fg3); background: var(--pillbgp); opacity: var(--pastop); box-shadow: inset 2.5px 0 var(--barp), 0 0 0 1.5px var(--bg); }
.pill.past .m { color: var(--fg3); }
.pill.sel { box-shadow: inset 2.5px 0 var(--bar), 0 0 0 1.5px var(--bg), 0 0 0 3px var(--fg); z-index: 5; opacity: 1; }
.ob { position: absolute; right: 2px; width: 42%; border-radius: 6px; z-index: 4; border: 1px dashed color-mix(in srgb, var(--fg) 40%, transparent); background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--fg) 11%, var(--bg)) 0 4px, color-mix(in srgb, var(--fg) 4%, var(--bg)) 4px 9px); color: var(--fg2); font-size: var(--fs-evt); padding: 3px 5px; overflow: hidden; pointer-events: none; }

/* right column */
.right { width: 320px; flex: none; border-left: 1px solid var(--hair2); background: var(--bg); position: relative; display: flex; flex-direction: column; }
.right .scroll { flex: 1; overflow-y: auto; scrollbar-width: none; }
.srch { display: flex; align-items: center; gap: 6px; padding: 12px 8px 6px 8px; height: 50px; flex: none; }
.srch label { flex: 1; height: 32px; border-radius: 8px; background: var(--bg2); display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--fg3); font-size: var(--fs-ui); }
.srch label:focus-within { box-shadow: 0 0 0 1.5px var(--fg3); background: var(--bg); }
.srch input { flex: 1; min-width: 0; color: var(--fg); }
.srch input::placeholder { color: var(--ph); }
.today-h { display: flex; align-items: baseline; justify-content: space-between; padding: 16px 20px 8px; }
.today-h b { font-family: var(--head); font-size: 16px; font-weight: 600; }
.today-h span { color: var(--fg3); font-size: var(--fs-meta); }
.card { margin: 0 8px 8px; padding: 12px 11px; border-radius: 12px; background: var(--bg1); border: 1px solid var(--hair); display: block; }
.card .lab { display: flex; gap: 8px; align-items: center; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg3); font-weight: 600; }
.card .lab .cd { text-transform: none; letter-spacing: 0; font-size: var(--fs-meta); color: var(--live); font-weight: 500; }
.card .ttl { display: flex; align-items: flex-start; gap: 10px; margin-top: 8px; width: 100%; }
.card .ttl .bar { width: 3px; align-self: stretch; border-radius: 2px; background: var(--cc); }

  linear-gradient(115deg, transparent 46%, color-mix(in srgb, var(--fg) 9%, transparent) 46% 49%, transparent 49%),
  linear-gradient(20deg, transparent 60%, color-mix(in srgb, var(--fg) 7%, transparent) 60% 62.5%, transparent 62.5%),
  repeating-linear-gradient(0deg, var(--bg2) 0 22px, var(--bg1) 22px 23px), var(--bg2); }

/* popovers */

.ev.st-no, .adi.st-no { background: color-mix(in srgb, var(--fill) 32%, transparent); color: var(--fg3); }
.ev.st-no .t, .ev.st-no .m, .adi.st-no span { text-decoration: line-through; text-decoration-color: color-mix(in srgb, currentColor 70%, transparent); }
.ev.st-no .m { color: var(--fg3); }
.ev.st-no::before { opacity: .45; }
/* a declined event on top of another one stays light but stops the text below from showing through */
.ev.st-no.cut { background: color-mix(in srgb, var(--fill) 32%, var(--bg)) !important; }
.rs-dashed .ev.st-maybe, .rs-dashed .adi.st-maybe { border: 1.5px dashed var(--bar); }
.rs-dashed .ev.st-no { border: 1px dashed color-mix(in srgb, var(--dash) 70%, transparent); }
.rs-notion .ev.st-maybe::before { background: repeating-linear-gradient(135deg, var(--bar) 0 3px, transparent 3px 6px); width: 5px; }
.rs-notion .adi.st-maybe { box-shadow: none; background-image: repeating-linear-gradient(135deg, var(--bar) 0 3px, transparent 3px 6px); background-size: 5px 100%; background-repeat: no-repeat; }
.rs-notion .ev.st-no { background: transparent; border: 1.5px dashed color-mix(in srgb, var(--dash) 75%, transparent); }
.rs-quiet .ev.st-none { border-style: solid; border-width: 1px; }
.rs-quiet .ev.st-maybe { background: repeating-linear-gradient(135deg, var(--fill) 0 6px, color-mix(in srgb, var(--fill) 55%, var(--bg)) 6px 12px); }
.rs-quiet .ev.st-no { opacity: .55; }
.later.st-no .ttl { text-decoration: line-through; color: var(--fg3); }
.later.st-none .b { background: none; box-shadow: inset 0 0 0 1.5px var(--cc); }
/* call: a big Join, the link under it */
.joinbig { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 34px; border-radius: 8px; background: var(--act); color: var(--onact); font-weight: 600; font-size: var(--fs-ui); }
.joinbig:hover { filter: brightness(1.08); }
.joinbig.ghost { background: var(--bg2); color: var(--fg); }
.joinbig.wait { background: var(--bg2); color: var(--fg2); cursor: default; font-weight: 500; }
.linkrow { display: flex; align-items: center; gap: 2px; margin-top: 8px; }
.linkrow .in { flex: 1; min-width: 0; margin-right: 0; color: var(--fg2); font-size: var(--fs-meta); text-overflow: ellipsis; }
.linkrow .in:focus { color: var(--fg); }
.linkrow .ibtn { opacity: 0; }
.prow:hover .linkrow .ibtn, .linkrow .in:focus ~ .ibtn { opacity: 1; }
/* location: open in a maps app */
.mapbtns { display: flex; gap: 2px; margin-left: 4px; flex: none; }
.locrow { display: flex; align-items: center; }
.locrow .in { flex: 1; min-width: 0; }
.mapmini { display: flex; gap: 6px; margin-top: 8px; }
.mapmini button { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 8px; border-radius: 7px; background: var(--bg2); font-size: var(--fs-meta); color: var(--fg2); }
.mapmini button:hover { color: var(--fg); filter: brightness(1.15); }
/* participants: replies */
.gr .st { font-size: var(--fs-meta); color: var(--fg3); padding-right: 6px; flex: none; }
.gr .st.yes { color: color-mix(in srgb, #3fa45b 80%, var(--fg)); }
.gr .st.maybe { color: #d9a33a; } .gr .st.no { color: #e5776c; }
.gr:hover .st, .gr.hold .st { display: none; }
.gr .sti { display: inline-flex; vertical-align: -2px; margin-left: 6px; }
.namehint { display: flex; align-items: center; gap: 8px; margin: 4px 0 0 -8px; padding: 6px 8px; border-radius: 8px; color: var(--fg2); font-size: var(--fs-meta); width: calc(100% + 8px); text-align: left; }
.namehint:hover { background: var(--hover); color: var(--fg); }
.namehint span { white-space: nowrap; }
.namehint b { font-weight: 500; color: var(--fg); margin-left: auto; white-space: nowrap; }
/* alignment guides */
#guides { position: absolute; inset: 0; pointer-events: none; z-index: 150; }
#guides .gv { position: absolute; width: 0; border-left: 1px solid rgba(64, 214, 120, .55); }
#guides .gv.r { border-left-color: rgba(90, 160, 255, .55); }
#guides .gv span { position: absolute; top: 2px; left: 2px; font: 9px ui-monospace, Menlo, monospace; color: rgba(64, 214, 120, .95); background: rgba(0,0,0,.6); padding: 0 2px; border-radius: 2px; }
#guides .gv.r span { color: rgba(120, 180, 255, .95); left: auto; right: 2px; }
#guides .bx { position: absolute; outline: 1px solid rgba(255, 70, 90, .95); background: rgba(255, 70, 90, .12); }
#guides .bx span { position: absolute; top: -12px; left: 0; font: 9px ui-monospace, Menlo, monospace; color: #fff; background: rgba(220, 40, 60, .9); padding: 0 3px; border-radius: 2px; white-space: nowrap; }
#guides .ol { position: absolute; outline: 1px dashed rgba(255, 255, 255, .14); }
#guides .legend { position: absolute; left: 12px; bottom: 12px; padding: 8px 10px; border-radius: 8px; background: rgba(10,10,12,.88); border: 1px solid rgba(255,255,255,.12); font: 11px/1.5 -apple-system, system-ui; color: #ddd; }
#guides .legend i { display: inline-block; width: 10px; height: 2px; vertical-align: 3px; margin-right: 5px; }
/* picker: locked list */
.pk-lock { display: flex; gap: 8px; padding: 4px 0; font-size: 11.5px; color: #8d8d95; border-top: 1px solid #1a1a1e; }
.pk-lock b { color: #cfcfd5; font-weight: 500; flex: 1; }
.pk-lock span { text-align: right; max-width: 55%; }
.pk-new { margin-top: 2px; padding: 8px 10px; border-radius: 8px; background: #16161a; border: 1px solid #222227; font-size: 11.5px; color: #9a9aa2; margin-bottom: 8px; }
.pk-new q { color: #cfcfd5; font-style: italic; }
.pk-opt .lk { margin-left: auto; font-size: 10px; color: #8fb3ff; letter-spacing: .03em; }

/* readability pass (round 2) */
/* type: four sizes (18 title, 12.5 body, 11.5 meta, 10.5 caps labels), weights 400 and 600 */
.rd-all .seg button, .rd-type .seg button, .rd-all .segs button, .rd-type .segs button { font-weight: 400; }
.rd-all .seg button.on, .rd-type .seg button.on { font-weight: 600; }
.rd-all .gsum .tx b, .rd-type .gsum .tx b, .rd-all .mbr .ti b, .rd-type .mbr .ti b { font-weight: 600; }
.rd-all .short b, .rd-type .short b { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg3); }
.rd-all .card .ttl b, .rd-type .card .ttl b { font-size: var(--fs-ui); }
.rd-all .today-h b, .rd-type .today-h b { font-size: 15px; }
/* colour: fg = content, fg2 = all metadata (times, emails, counts), fg3 = labels and placeholders only */
.rd-all .gr .who span, .rd-colour .gr .who span, .rd-all .gsum .tx span, .rd-colour .gsum .tx span, .rd-all .when .dur, .rd-colour .when .dur, .rd-all .later .tm, .rd-colour .later .tm, .rd-all .mbr .ti span, .rd-colour .mbr .ti span, .rd-all .hdr .wkno, .rd-colour .hdr .wkno { color: var(--fg2); }
.rd-all .gut .h, .rd-colour .gut .h { color: var(--fg2); }
.rd-all .dh .c, .rd-colour .dh .c { color: var(--fg2); }
.rd-all .dh .c.past, .rd-colour .dh .c.past { color: var(--fg3); }
/* space: no boxes inside boxes; cards lose their frame, sections get 24 px and one hairline */
.rd-all .card, .rd-space .card { background: none; border-color: transparent; padding: 8px 12px; margin-bottom: 4px; }
.rd-all .card .acts, .rd-space .card .acts { margin-top: 10px; }
.rd-all .lab2, .rd-space .lab2 { padding-top: 24px; }
.rd-all .short, .rd-space .short { margin-top: 24px; }
/* short blocks: the title alone on one line */

/* ---------- round 3: clean-up approaches ---------- */
/* every approach but "off": three sizes (18 / 12.5 / 11.5), weights 400 and 600 (events keep 500), labels in sentence case */
.po-on { --fs-evt: 11.5px; --fs-meta: 11.5px; --fs-pill: 11.5px; }
.po-on .hdr h2, .po-on .pd-top input.title, .po-on .today-h b, .po-on .modal .mh b, .po-on .sheet .sc h3 { font-size: 18px; }
.po-on .today-h b { font-family: var(--head); font-weight: 600; }
.po-on .hdr h2 span { font-weight: 400; }
.po-on .sheet nav b, .po-on .cmd .q input { font-size: 12.5px; }
.po-on .acct, .po-on .card .lab, .po-on .lab2, .po-on .cmd .sec, .po-on .sres .sh, .po-on .short b, .po-on .pop .sec, .po-on .mbpop .sec { font-size: 11.5px; text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--fg3); }
.po-on .card .lab .cd { font-weight: 400; }
.po-on .mm, .po-on .mm .wd, .po-on .ad .g .lbl, .po-on .gut .h, .po-on .gut .now, .po-on .kbd, .po-on .av, .po-on .gr .opt, .po-on .chip .av, .po-on .ad .more { font-size: 11.5px; }
.po-on .kbd, .po-on .btn, .po-on .seg button, .po-on .segs button, .po-on .mm .wd, .po-on .going, .po-on .mbr .ti b { font-weight: 400; }
.po-on .btn.act, .po-on .btn.red, .po-on .seg button.on, .po-on .segs button.on, .po-on .bd, .po-on .sheet nav button.on { font-weight: 600; }
.po-on .gut .now { font-weight: 600; color: var(--fg); }
.po-on .av { color: var(--fg); }
/* quiet chrome: what is not content steps back */
.po-quiet .ibtn { color: var(--fg3); }
.po-quiet .ibtn:hover, .po-quiet .ibtn.on { color: var(--fg); }
.po-quiet .kbd { background: none; min-width: 0; padding: 0 1px; color: var(--fg3); }
.po-quiet .btn-line { border-color: transparent; }
.po-quiet .pd .hr { background: transparent; margin: 4px -14px 4px -20px; }
.po-quiet .short { border-top-color: transparent; }
.po-quiet .srch label { background: none; box-shadow: inset 0 0 0 1px var(--hair2); }
.po-quiet .srch label:focus-within { box-shadow: inset 0 0 0 1.5px var(--fg3); }
.po-quiet .addin { background: none; box-shadow: inset 0 0 0 1px var(--hair2); }
.po-quiet .seg { background: none; box-shadow: inset 0 0 0 1px var(--hair2); }
.po-quiet .later .vid { opacity: .7; }
/* one text size in the panels */
.po-one { --fs-meta: 12.5px; }
.po-one .acct, .po-one .card .lab, .po-one .lab2, .po-one .short b, .po-one .sres .sh, .po-one .pop .sec, .po-one .cmd .sec, .po-one .mbpop .sec, .po-one .kbd, .po-one .ad .more { font-size: 12.5px; }
.po-one .card .lab .cd { font-size: 12.5px; }
.po-one .hdr .wkno, .po-one .tabs, .po-one .nav, .po-one .btn-line { font-size: 12.5px; }
/* my reply inside my own participant row */
.seg.sm { margin-top: 6px; }
.seg.sm button { padding: 1px 10px; }
/* picker: help, hover preview, counter */
.pk-opt .hq { margin-left: 6px; width: 16px; height: 16px; border-radius: 50%; border: 1px solid #3a3a42; color: #8a8a92; font-size: 10px; display: inline-grid; place-items: center; flex: none; position: relative; }
.pk-opt .hq:hover { color: #fff; border-color: #777; }
.pk-opt .hq:hover::after { content: attr(data-help); position: absolute; right: -4px; top: 22px; width: 270px; padding: 8px 10px; border-radius: 8px; background: #26262c; border: 1px solid #3a3a42; color: #e6e6ea; font-size: 11.5px; line-height: 1.45; text-align: left; white-space: normal; z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.pk-opt .end { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: none; }
.pk-opt .end .rec, .pk-opt .end .lk { margin-left: 0; }
.pk-opt .end .hq { margin-left: 0; }
.pk-tog { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: 7px; color: #b4b4bb; font-size: 12px; text-align: left; }
.pk-tog:hover { background: #1b1b1f; }
.pk-tog i { width: 26px; height: 15px; border-radius: 8px; background: #33333a; position: relative; flex: none; }
.pk-tog i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 11px; height: 11px; border-radius: 50%; background: #999; transition: transform .15s; }
.pk-tog.on i { background: #ececf0; } .pk-tog.on i::after { transform: translateX(11px); background: #111; }
.pk-audit { margin-top: 8px; height: 46px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 6px 10px; border-radius: 8px; background: #16161a; border: 1px solid #222227; font: 11.5px/1.5 ui-monospace, Menlo, monospace; color: #b8b8c0; }
.pk-audit b { color: #fff; font-weight: 600; }
.pk-ba { display: flex; align-items: center; gap: 2px; margin: 4px 0 6px; padding: 2px; border-radius: 9px; border: 1px solid #2a2a30; }
.pk-ba button { flex: 1; padding: 6px 8px; border-radius: 7px; color: #9a9aa2; font-size: 12px; text-align: center; }
.pk-ba button.on { background: #ececf0; color: #111; font-weight: 600; }
.pk-ba span { font: 10px ui-monospace, Menlo, monospace; color: #6c6c74; padding: 0 6px; }
.pvhl { outline: 1.5px solid rgba(90, 160, 255, .85) !important; outline-offset: 1px; box-shadow: 0 0 0 5px rgba(90, 160, 255, .16) !important; }

/* ---------- round 4 ---------- */
.byline { margin: -4px 0 8px 28px; color: var(--fg3); font-size: var(--fs-meta); line-height: 16px; }
/* participants: one line per person */
.gl:has(.gr.one) { margin-top: 4px; }
.gr.one { min-height: 28px; padding: 2px 0 2px 8px; gap: 8px; align-items: center; }
.gr.one .who { min-height: 24px; }
.gr.one .nm1 { display: flex; align-items: baseline; gap: 6px; min-width: 0; font-size: var(--fs-ui); line-height: 20px; color: var(--fg); }
.gr.one .nm1 b { font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.gr.one .role { color: var(--fg3); font-size: var(--fs-meta); white-space: nowrap; flex: none; }
.gr.one .em { display: block; color: var(--fg3); font-size: var(--fs-meta); line-height: 16px; }
.gr.one.gone .nm1 b { text-decoration: line-through; color: var(--fg3); }
.gr.one .rm { width: 14px; height: 14px; display: grid; place-items: center; flex: none; }
.gr.one .av.xs { width: 18px; height: 18px; font-size: 11.5px; margin: 0; }
.gr.one .acts { margin-left: auto; }
.gr.one .seg.sm { margin: 4px 0 2px; }
/* declined: solid, never see-through */
.ds .ev.st-no, .ds.rs-quiet .ev.st-no { opacity: 1; background: color-mix(in srgb, var(--fill) 38%, var(--bg)); }
.ds .ev.st-no .t, .ds .ev.st-no .m { color: var(--fg3); }
.ev.behind { box-shadow: none; }
/* "+N" for events beyond two lanes */
.evmore { position: absolute; right: 3px; height: 16px; min-width: 22px; padding: 0 5px; border-radius: 8px; background: var(--bg3); color: var(--fg); font-size: var(--fs-evt); font-weight: 600; z-index: 7; box-shadow: 0 0 0 1.5px var(--bg); display: grid; place-items: center; }
.evmore:hover, .evmore.on { background: var(--fg); color: var(--bg); }

/* ---------- design system (round 4) ----------
   Surfaces  --bg: app, sidebar, right column · --pop: menus, dialogs · --bg2: fields, raised controls · --hover: hover, selected row
   Text      18 titles · 12.5 text · 11.5 small (events 11.5 / 500) · --fg content · --fg2 secondary · --fg3 labels, hints, placeholders, icons
   Heights   28 list rows, menu rows, small buttons, sidebar rows · 32 panel rows, buttons, fields, search
   Icon btn  26 with a 16 icon (panel, header) · 22 with a 14 icon (sidebar, rows)
   Radius    6 rows, events, icon buttons, segments · 8 buttons, fields, segmented controls · 12 menus, dialogs, cards
   Spacing   4 · 8 · 12 · 16 · 24 */
.ds .side { background: var(--bg); }
.ds .right { border-left-color: var(--hair); }
/* one segmented control: Day/Week/Month, Going?, settings */
.ds .tabs, .ds .seg, .ds .segs { display: inline-flex; gap: 0; padding: 2px; border-radius: 8px; background: none; box-shadow: inset 0 0 0 1px var(--hair2); }
.ds .tabs button, .ds .seg button, .ds .segs button { height: 22px; padding: 0 10px; border-radius: 6px; color: var(--fg2); font-size: var(--fs-meta); font-weight: 400; box-shadow: none; display: inline-flex; align-items: center; }
.ds .tabs .on, .ds .seg button.on, .ds .segs button.on { background: var(--thumb); color: var(--fg); font-weight: 600; box-shadow: none; padding-bottom: 0; }
.ds .tabs button:not(.on):hover, .ds .seg button:not(.on):hover, .ds .segs button:not(.on):hover { color: var(--fg); background: var(--hover); }
/* buttons: 32 and 28 */
.ds .btn { height: 32px; padding: 0 12px; border-radius: 8px; }
.ds .btn.sm, .ds .btn-line { height: 28px; padding: 0 10px; border-radius: 8px; }
.ds .split { height: 32px; border-radius: 8px; } .ds .split .a { padding: 0 12px; }
.ds .joinbig, .ds .join { height: 32px; border-radius: 8px; }
.ds .sq { width: 32px; height: 32px; border-radius: 8px; }
.ds .mbjoin { height: 28px; border-radius: 8px; }
.ds .prow.tall > .ic { margin-top: 14px; }
/* radius 6 for rows and small things, 8 for controls, 12 for surfaces */
.ds .ibtn, .ds .cal, .ds .addrow, .ds .side .foot, .ds .later, .ds .short button, .ds .pop .it, .ds .gr, .ds .sheet nav button, .ds .fld, .ds .in, .ds .going, .ds .pair button, .ds .cmd .it, .ds .ad .more, .ds .adi, .ds .mm .d.today, .ds .namehint { border-radius: 6px; }
.ds .mm .wk.first { border-radius: 6px 0 0 6px; } .ds .mm .wk.last { border-radius: 0 6px 6px 0; }
.ds .calsel, .ds .addin, .ds .srch label { border-radius: 8px; }
.ds .modal, .ds .toast, .ds .card, .ds .pop, .ds .mbpop, .ds .sbox { border-radius: 12px; }
/* row heights: 28 for lists and menus */
.ds .later { height: 28px; }
.ds .pop .it { min-height: 28px; }
.ds .sheet nav button { height: 28px; }
.ds .cmd .it { height: 32px; }
.ds .side .foot { height: 28px; padding: 0 4px; }
.ds .srow { min-height: 44px; }
.ds .calsel { gap: 10px; }
.ds .hidden-meet { gap: 10px; }
.ds .namehint { gap: 8px; }
/* design-system page */
.dsys { width: 940px; max-height: 820px; overflow-y: auto; padding: 24px 28px 28px; }
.dsys h3 { font-family: var(--head); font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.dsys > p { color: var(--fg2); margin-bottom: 16px; }
.dsys h4 { font-size: var(--fs-meta); font-weight: 600; color: var(--fg3); margin: 20px 0 8px; }
.dsys .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; }
.dsys .tok { display: flex; align-items: center; gap: 12px; min-height: 28px; }
.dsys .tok i { width: 28px; height: 20px; border-radius: 6px; flex: none; box-shadow: inset 0 0 0 1px var(--hair2); }
.dsys .tok b { font-weight: 600; width: 90px; flex: none; }
.dsys .tok span { color: var(--fg2); font-size: var(--fs-meta); }
.dsys .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 36px; }
.dsys .bar { height: 12px; background: var(--fg3); border-radius: 2px; }
.dsys .rad { width: 56px; height: 36px; background: var(--bg2); box-shadow: inset 0 0 0 1px var(--hair2); display: grid; place-items: center; color: var(--fg2); font-size: var(--fs-meta); }
.dsys .evs { display: flex; gap: 8px; }
.dsys .evs > div { position: relative; width: 118px; height: 48px; }
.dsys .evs .ev { left: 0; top: 0; width: 113px; height: 44px; }
.dsys .evs small { position: absolute; top: 50px; left: 0; color: var(--fg3); font-size: var(--fs-meta); }

/* ---------- round 5 ---------- */
.evmore.less { background: var(--fg); color: var(--bg); }
.pop.stack { padding: 4px; display: flex; flex-direction: column; gap: 3px; }
.pop.stack .sk { display: grid; grid-template-columns: 76px 1fr auto; align-items: center; gap: 8px; min-height: 28px; padding: 4px 8px 4px 12px; border-radius: 6px; background: var(--fill); color: var(--tc); text-align: left; position: relative; font-size: var(--fs-ev); }
.pop.stack .sk::before { content: ""; position: absolute; left: 3px; top: 4px; bottom: 4px; width: 3px; border-radius: 2px; background: var(--bar); }
.pop.stack .sk .tm { color: var(--mc); font-size: var(--fs-evt); }
.pop.stack .sk .tt { font-weight: var(--ev-w); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pop.stack .sk .rp { color: var(--fg3); font-size: var(--fs-evt); }
.pop.stack .sk:hover { filter: brightness(1.15); }
.pop.stack .sk.st-none { background: var(--bg); box-shadow: inset 0 0 0 1px var(--dash); }
.pop.stack .sk.st-maybe { background: repeating-linear-gradient(135deg, var(--fill) 0 6px, color-mix(in srgb, var(--fill) 55%, var(--bg)) 6px 12px); }
.pop.stack .sk.st-no { background: color-mix(in srgb, var(--fill) 38%, var(--bg)); }
.pop.stack .sk.st-no .tt { text-decoration: line-through; color: var(--fg3); }
</style>
</head>
<body>
<div id="page">
  <div id="stage"><div id="frame"><div id="host"></div><div id="tt"></div></div></div>
  <aside id="picker"></aside>
</div>
<script>
// ================================================================ icons
const P = {
  search: '<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/>',
  sideL: '<rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6 3v10"/>',

}

// ================================================================ layout of a day
// left/width are fractions of the day column; px is an extra indent in pixels
const dayOf = evs => evs.length ? evs[0].d : -1;
function layoutDay(evs) {
  const out = [];
  const pillMode = C('short') === 'pill', mode = C('overlap');
  const items = evs.map(e => ({ e, s: e.s, en: isShort(e) ? e.s + (pillMode ? 18 : 22) : e.e, pill: isShort(e) && pillMode, px: 0 })).sort((a, b) => a.s - b.s || (b.en - b.s) - (a.en - a.s));
  // smart: short items (tasks, 0-min) never split a long event; they sit on its right half, like pills
  const side = it => it.pill || (mode === 'smart' && isShort(it.e));
  // events I have not accepted (declined, no reply) go on the right or behind; they never push accepted ones
  // a widened day shows everything side by side
  const un = A.wide === dayOf(evs) ? 'normal' : C('unsure'), unsure = it => ['no', 'none'].includes(myResp(it.e));
  const behind = un === 'behind' ? items.filter(unsure) : [];
  const right = un === 'right' || un === 'third' ? items.filter(it => unsure(it) && !side(it)) : [];
  const lanes2 = C('more') !== 'none' && A.wide !== dayOf(evs);
  const over = [];
  const blocksIn = items.filter(it => !side(it) && !behind.includes(it) && !right.includes(it));
  if (mode === 'columns' || mode === 'gcal') {
    let cluster = [], end = -1;
    const flush = () => {
      const cols = [];
      cluster.forEach(it => { let i = cols.findIndex(c => c <= it.s); if (i < 0) { i = cols.length; cols.push(0); } cols[i] = it.en; it.col = i; });
      const n = cols.length;
      cluster.forEach(it => {
        it.left = it.col / n; it.width = 1 / n;
        // Google: every column but the last reaches into its right neighbour; later columns sit on top
        if (mode === 'gcal' && n > 1 && it.col < n - 1) it.width = Math.min(1 - it.left, 1.7 / n);
        if (mode === 'gcal' && it.col > 0) it.cut = true;
        it.level = it.col; out.push(it);
      });
      cluster = []; end = -1;
    };
    blocksIn.forEach(it => { if (it.s >= end && cluster.length) flush(); cluster.push(it); end = Math.max(end, it.en); });
    if (cluster.length) flush();
  } else if (mode === 'smart') {
    // later starts cascade with a small indent; events that start within 30 min of each other share the width
    blocksIn.forEach(it => {
      const under = out.filter(o => o.s < it.en && o.en > it.s);
      // two lanes are the limit: a third event at the same time becomes "+N"
      if (lanes2 && under.filter(o => o.s <= it.s && o.en > it.s).length >= 2) { over.push(it); return; }
      const host = [...under].reverse().find(o => it.s - o.grp.s < 30);
      if (host) {
        const g = host.grp; g.items.push(it); it.grp = g; it.level = host.level; it.px = host.px; it.cut = host.cut;
        const n = g.items.length; g.items.forEach((o, i) => { o.left = g.left + (g.width * i) / n; o.width = g.width / n; if (i) o.cut = true; });
        out.push(it); return;
      }
      const top = under.length ? under.reduce((a, b) => (b.level > a.level || (b.level === a.level && b.s > a.s) ? b : a)) : null;
      it.level = top ? top.level + 1 : 0;
      it.left = top ? top.grp.left : 0; it.width = 1 - it.left; it.px = top ? top.px + 14 : 0; it.cut = !!top;
      it.grp = { s: it.s, left: it.left, width: it.width, items: [it] };
      out.push(it);
    });
  } else {
    blocksIn.forEach(it => {
      const under = out.filter(o => o.s < it.en && o.en > it.s);
      const same = under.filter(o => Math.abs(o.s - it.s) < 1);
      if (same.length) {
        const n = same.length + 1; same.forEach((o, i) => { o.left = i / n; o.width = 1 / n; });
        it.left = (n - 1) / n; it.width = 1 / n; it.level = same[0].level; out.push(it); return;
      }
      const level = under.length ? Math.max(...under.map(o => o.level)) + 1 : 0;
      it.level = level; it.left = level === 0 ? 0 : Math.min(.45 + (level - 1) * .12, .7); it.width = 1 - it.left;
      if (level > 0) { it.cut = true; under.forEach(o => { if (o.level === level - 1 && o.width === 1 - o.left) o.width = Math.max(.8 - o.left, .4); }); }
      out.push(it);
    });
  }
  // unaccepted events: right half (or third) on top of the accepted ones they overlap
  const cutAt = un === 'third' ? .66 : .5;
  const placedRight = [];
  right.forEach(it => {
    const hit = out.filter(o => o.s < it.en && o.en > it.s);
    if (!hit.length) { it.left = 0; it.width = 1; it.level = 0; out.push(it); return; }
    if (placedRight.some(o => o.s < it.en && o.en > it.s)) { over.push(it); return; }
    hit.forEach(o => { if (Math.abs(it.s - o.s) < 30 && o.left < cutAt) o.width = Math.min(o.width, cutAt - o.left); });
    it.left = cutAt; it.width = 1 - cutAt; it.level = 8; it.cut = true; placedRight.push(it); out.push(it);
  });
  const blocks = [...out];
  items.filter(it => side(it) && !behind.includes(it)).forEach(it => {
    if (lanes2 && blocks.filter(o => o.s <= it.s && o.en > it.s).length >= 2) { over.push(it); return; }
    const hit = blocks.some(o => o.s < it.en && o.en > it.s) || out.some(o => side(o) && o.s < it.en && o.en > it.s);

  });

}

function contactsFor(q, e) {

  if (!q) return RECENTS.filter(id => !taken.has(id)).slice(0, 5).map(id => ({ id, src: 'recent' }));
  const ql = q.toLowerCase();
  const pool = Object.keys(PEOPLE).filter(id => id !== 'me' && !taken.has(id) && ok(id));
  const hits = pool.filter(id => (PEOPLE[id].name || '').toLowerCase().includes(ql) || PEOPLE[id].email.toLowerCase().includes(ql)).slice(0, 6).map(id => ({ id, src: PEOPLE[id].src }));
  if (/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(q) && !hits.some(h => PEOPLE[h.id].email === ql)) hits.push({ email: q, src: 'new' });

}

function scale() { const d = document.querySelector('.desk'); return d ? d.getBoundingClientRect().width / 1440 : 1; }

function drawGuides() {
