<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horion Corners</title>
<!-- Horion v12 round 1: corner radii. Every spot the radius audit changes, zoomed. -->
<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #08080a; color: #d8d8dc; font: 13px/1.4 -apple-system, system-ui, sans-serif; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; padding: 0; }
input { font: inherit; color: inherit; background: none; border: 0; outline: 0; }
#root { display: flex; height: 100%; }
#stage { flex: 1; position: relative; overflow: hidden; }
.shot #picker { display: none; }

/* ---------- picker (outside the app) ---------- */
#picker { width: 380px; flex: none; border-left: 1px solid #222; background: #111113; overflow-y: auto; padding: 18px 18px 84px; }
#picker h1 { font-size: 15px; font-weight: 650; color: #f2f2f4; margin: 0; }
#picker h2 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: #6c6c74; font-weight: 600; margin: 22px 0 8px; }
#picker .lede { color: #8a8a92; font-size: 12px; margin: 4px 0 14px; }
.pk-btn { padding: 5px 9px; border-radius: 7px; background: #1b1b1f; color: #b4b4bb; font-size: 12px; border: 1px solid #26262b; }
.pk-btn:hover { background: #222227; color: #eee; }
.pk-btn.on { background: #ececf0; color: #111; border-color: #ececf0; }
.pk-scenes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.pk-notes { padding: 10px 12px; border-radius: 9px; background: #17171a; border: 1px solid #222226; color: #a6a6ae; font-size: 12px; }
.pk-notes ul { margin: 0; padding-left: 15px; }
.pk-ba { display: flex; gap: 4px; align-items: center; margin-bottom: 10px; }
.pk-ba span { color: #6c6c74; font-size: 11px; margin-left: 4px; }
.pk-tog { display: flex; gap: 8px; align-items: center; color: #a6a6ae; font-size: 12px; margin-top: 6px; }
.pk-tog i { width: 24px; height: 14px; border-radius: 7px; background: #2a2a30; position: relative; flex: none; }
.pk-tog i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 10px; height: 10px; border-radius: 50%; background: #8a8a92; transition: transform .15s; }
.pk-tog.on i { background: #ececf0; } .pk-tog.on i::after { transform: translateX(10px); background: #111; }
.pk-audit { margin-top: 8px; color: #8a8a92; font-size: 11.5px; }
.pk-audit b { color: #eee; }
.pk-dec { margin-bottom: 14px; }
.pk-dec > b { color: #f2f2f4; font-size: 12.5px; }
.pk-dec p { color: #8a8a92; font-size: 12px; margin: 3px 0 6px; }
.pk-new { color: #a6a6ae; font-size: 12px; margin: 3px 0 6px; }
.pk-new q { color: #e6e6ea; }
.pk-opt { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 8px; border-radius: 7px; color: #b4b4bb; font-size: 12px; }
.pk-opt:hover { background: #1b1b1f; color: #eee; }
.pk-opt.on { color: #f4f4f6; background: #1d1d22; }
.pk-opt .r { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #4a4a52; flex: none; }
.pk-opt.on .r { border-color: #f4f4f6; background: radial-gradient(#f4f4f6 0 2.5px, transparent 3px); }
.pk-opt .end { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.pk-opt .rec, .pk-opt .lk { font-size: 10.5px; color: #6c6c74; }
.pk-opt .hq { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #3a3a42; color: #8a8a92; font-size: 10px; display: inline-grid; place-items: center; position: relative; }
.pk-opt .hq:hover::after { content: attr(data-help); position: absolute; right: -4px; top: 22px; width: 270px; padding: 8px 10px; border-radius: 8px; background: #26262c; border: 1px solid #3a3a42; color: #e6e6ea; font-size: 11.5px; line-height: 1.45; white-space: normal; z-index: 10; }
.pk-lock { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 3px 0; color: #8a8a92; }
.pk-lock b { font-weight: 500; color: #c4c4cb; }
.pk-foot { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 22px; }
/* Agentation toolbar: bottom right of the app, not over the picker. */
.agt-host { right: 396px !important; bottom: 16px !important; }
#picker .read { color: #a6a6ae; font-size: 12px; margin: -6px 0 14px; padding-left: 10px; border-left: 2px solid #2a2a30; }
#picks { margin-top: 10px; width: 100%; height: 150px; background: #141417; color: #bdbdc4; border: 1px solid #25252a; border-radius: 8px; padding: 8px; font: 11px/1.45 ui-monospace, Menlo, monospace; resize: vertical; }

/* ---------- preview: crossfade, short glow, alignment guides ---------- */
.ghost { pointer-events: none; z-index: 140; transition: opacity 140ms ease; }
.pvhl { animation: pvpulse 900ms ease-out forwards; }
@keyframes pvpulse { 0% { box-shadow: 0 0 0 0 rgba(90,160,255,.9), 0 0 0 1.5px rgba(90,160,255,.9); } 60% { box-shadow: 0 0 0 8px rgba(90,160,255,0), 0 0 0 1.5px rgba(90,160,255,.9); } 100% { box-shadow: 0 0 0 8px rgba(90,160,255,0), 0 0 0 1.5px transparent; } }
#guides { position: absolute; inset: 0; pointer-events: none; z-index: 150; }
#guides .gv { position: absolute; width: 0; border-left: 1px solid rgba(64, 214, 120, .55); }
#guides .gv.r { border-left-color: rgba(90, 160, 255, .55); }
#guides .gv span { position: absolute; top: 2px; left: 2px; font: 9px ui-monospace, Menlo, monospace; color: rgba(64, 214, 120, .95); background: rgba(0,0,0,.6); padding: 0 2px; }
#guides .bx { position: absolute; outline: 1px solid rgba(255, 70, 90, .95); background: rgba(255, 70, 90, .12); }
#guides .bx span { position: absolute; top: -12px; left: 0; font: 9px ui-monospace, Menlo, monospace; color: #fff; background: rgba(220, 40, 60, .9); padding: 0 3px; white-space: nowrap; }
#guides .ol { position: absolute; outline: 1px dashed rgba(255, 255, 255, .14); }
#guides .legend { position: absolute; left: 12px; bottom: 12px; padding: 8px 10px; border-radius: 8px; background: rgba(10,10,12,.88); border: 1px solid rgba(255,255,255,.12); font: 11px/1.5 -apple-system, system-ui; color: #ddd; }

/* ================= the app: corner zoom board ================= */
@font-face { font-family: "Inter"; src: url("../mockup-v11/fonts/InterVariable.woff2") format("woff2"); font-weight: 100 900; }
.desk { --bg: #0B0B0C; --rail: #070708; --bg1: #151516; --bg3: #2A2A2C; --pop: #0B0B0C; --hoverPop: #18181A; --hover: #161617; --hoverRail: #121213; --eyeHover: #1F1F20;
  --selected: #1E1E1F; --hair: #1C1C1D; --hair2: #2A2A2C; --grid: #212123;
  --fg: #EBEBED; --fg2: #CCCCCE; --fg3: #A8A8AA; --act: #EBEBED; --onact: #0B0B0C;
  --blue: #0E1A2C; --blueBar: #4A78D8; --blueT: #DCE4F2; --orange: #26150B; --orangeBar: #C8671F; --orangeT: #F1DCCB;
  --board: #050506; --tile: #0E0E10; --tileEdge: #1A1A1D; --lab: #8A8A92;
  --font: "Inter", -apple-system, system-ui, sans-serif; --fs: 12.5px; --fs-s: 11px; }
.desk.paper { --bg: #FBFBFB; --rail: #F4F4F5; --bg1: #F1F1F2; --bg3: #DCDCDC; --pop: #FBFBFB; --hoverPop: #EEEEEF; --hover: #F1F1F1; --hoverRail: #EAEAEB; --eyeHover: #DFDFE0;
  --selected: #EAEAEB; --hair: #E8E8E8; --hair2: #DCDCDC; --grid: #E1E1E2;
  --fg: #1D1D20; --fg2: #4A4A50; --fg3: #606067; --act: #1D1D20; --onact: #FBFBFB;
  --blue: #E3ECFB; --blueBar: #3E6FD8; --blueT: #1C2E52; --orange: #FBE9DC; --orangeBar: #D0651B; --orangeT: #57290A;
  --board: #E9E9EA; --tile: #FBFBFB; --tileEdge: #DDDDDE; --lab: #6C6C74; }
.desk { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: var(--board); color: var(--fg); font: var(--fs)/1.4 var(--font); display: flex; -webkit-font-smoothing: antialiased; }
.nav { width: 220px; flex: none; padding: 16px 12px; border-right: 1px solid var(--tileEdge); background: var(--tile); display: flex; flex-direction: column; gap: 2px; }
.nav .t { font-weight: 600; margin: 0 8px 10px; }
.nav button { height: 28px; padding: 0 8px; border-radius: 8px; color: var(--fg2); text-align: left; }
.nav button:hover { background: var(--hover); } .nav button.on { background: var(--selected); color: var(--fg); }
.nav .sp { flex: 1; }
.board { flex: 1; overflow: auto; padding: 24px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 20px; }
.tile { background: var(--tile); border: 1px solid var(--tileEdge); border-radius: 12px; padding: 14px 16px 16px; }
.tile h3 { margin: 0 0 2px; font-size: 13px; font-weight: 600; }
.tile .val { color: var(--lab); font-size: 11.5px; margin-bottom: 12px; }
.tile .val b { color: var(--fg); font-weight: 600; }
.pair { display: flex; gap: 24px; align-items: flex-start; }
.z4 { zoom: 4; } .z1 { opacity: .9; }
.cap { font-size: 10.5px; color: var(--lab); margin-top: 6px; }
.spot { background: var(--bg); position: relative; }

/* Day header today number */
.dh { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; font-size: 12.5px; font-weight: 500; }
.dh .n { background: var(--act); color: var(--onact); font-weight: 600; padding: 0 5px; min-width: 20px; text-align: center; line-height: 18px; border-radius: var(--r-hdr); }
/* Month cell */
.mc { display: flex; width: 150px; height: 64px; }
.mc > div { flex: 1; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); padding: 4px; }
.mc .num { display: inline-block; height: 22px; min-width: 22px; padding: 0 6px; line-height: 22px; text-align: center; border-radius: var(--r-mon); font-size: 12.5px; }
.mc .num.today { background: var(--act); color: var(--onact); font-weight: 600; } .mc .num.hot { background: var(--hover); }
/* Event */
.ev { position: absolute; border-radius: 4px; background: var(--blue); color: var(--blueT); font-size: 11.5px; padding: 3px 6px 3px 10px; overflow: hidden; white-space: nowrap; }
.ev::before, .chip::before, .sk::before { content: ""; position: absolute; left: 3px; top: 3px; bottom: 3px; width: 3px; border-radius: 1.5px; background: var(--blueBar); }
.ev.o { background: var(--orange); color: var(--orangeT); } .ev.o::before { background: var(--orangeBar); }
.grid2 { width: 150px; height: 70px; border-left: 1px solid var(--grid); }
.pn { position: absolute; height: 16px; padding: 0 5px; min-width: 22px; text-align: center; font: 600 10.5px/16px var(--font); background: var(--bg3); color: var(--fg); border-radius: var(--r-pn); box-shadow: 0 0 0 1.5px var(--bg); }
/* All-day row */
.ad { display: flex; flex-direction: column; gap: 2px; width: 200px; padding: 4px 0; }
.chip { position: relative; height: 20px; margin: 0 4px 0 2px; border-radius: 4px; background: var(--blue); color: var(--blueT); font-size: 12px; padding: 0 8px 0 12px; line-height: 20px; white-space: nowrap; overflow: hidden; }
.ad .more { height: 20px; margin: 0 4px 0 2px; padding: 0 10px; line-height: 20px; font-size: 11px; border-radius: var(--r-adm); }
.hotbg { background: var(--hover); color: var(--fg); }
.mm { width: 150px; padding: 4px; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); display: flex; flex-direction: column; gap: 1px; }
.mm .ln { height: 18px; display: flex; align-items: center; gap: 6px; padding: 0 6px; font-size: 11.5px; white-space: nowrap; overflow: hidden; }
.mm .ln i { width: 6px; height: 6px; border-radius: 50%; background: var(--blueBar); flex: none; } .mm .ln.o i { background: var(--orangeBar); }
.mm .more { height: 18px; padding: 0 7px; line-height: 18px; font-size: 11px; border-radius: var(--r-mm); align-self: flex-start; }
/* Surfaces */
.pop { background: var(--pop); border: 1px solid var(--hair2); border-radius: 12px; box-shadow: 0 12px 24px rgba(0,0,0,.35); }
.paper .pop { box-shadow: 0 12px 24px rgba(20,20,30,.10); }
.stack { width: 200px; padding: 4px; display: flex; flex-direction: column; gap: 3px; }
.sk { position: relative; height: 28px; padding: 0 8px 0 12px; display: grid; grid-template-columns: 70px 1fr; align-items: center; background: var(--blue); color: var(--blueT); font-size: 12px; border-radius: var(--r-sk); white-space: nowrap; overflow: hidden; }
.sk.o { background: var(--orange); color: var(--orangeT); } .sk.o::before { background: var(--orangeBar); }
.sk span:first-child { opacity: .75; font-size: 11px; }
.menu { width: 190px; padding: 6px; }
.menu .it, .dl .it { height: 28px; padding: 0 10px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.menu .it { border-radius: var(--r-menu); } .menu .it.hot { background: var(--hoverPop); }
.menu .ck { width: 14px; text-align: center; color: var(--fg); font-size: 11px; }
.pal { width: 300px; padding: 6px; }
.pal .it { height: 32px; padding: 0 12px; display: flex; align-items: center; gap: 10px; font-size: 12.5px; border-radius: var(--r-pal); }
.pal .it.hot { background: var(--hoverPop); } .pal .k { margin-left: auto; color: var(--fg3); font-size: 11px; }
.pal .ic { width: 14px; height: 14px; border: 1.5px solid var(--fg3); border-radius: 4px; }
.dl { width: 190px; padding: 4px; } .dl .it { padding: 0 8px; border-radius: 8px; } .dl .it.hot { background: var(--hoverPop); }
.dl .b { width: 3px; height: 14px; border-radius: 1.5px; background: var(--blueBar); }
/* Buttons in rows */
.toast { height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 5px 0 14px; border-radius: 12px; background: var(--pop); border: 1px solid var(--hair2); font-size: 12.5px; white-space: nowrap; }
.toast .undo { height: 26px; display: flex; align-items: center; gap: 7px; padding: 0 5px 0 9px; border-radius: var(--r-undo); background: var(--hoverPop); font-weight: 600; }
.kc { font-size: 10.5px; color: var(--fg3); font-weight: 500; }
.toast .x { width: 22px; height: 22px; display: grid; place-items: center; color: var(--fg3); }
.side { width: 210px; padding: 6px 8px; background: var(--rail); }
.cal { height: 26px; display: flex; align-items: center; gap: 10px; padding: 0 4px 0 8px; margin: 0 -4px; border-radius: 8px; font-size: 12.5px; }
.cal.hot { background: var(--hoverRail); }
.cal .cb { width: 12px; height: 12px; border-radius: 4px; background: var(--blueBar); flex: none; }
.cal .eye { margin-left: auto; width: 22px; height: 22px; display: grid; place-items: center; color: var(--fg3); border-radius: var(--r-eye); }
.cal .eye.hot { background: var(--eyeHover); color: var(--fg); }
.rems { width: 220px; padding: 6px 16px; }
.rem { height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 8px; margin: 0 -8px; border-radius: 8px; font-size: 12.5px; }
.rem.hot { background: var(--hoverRail); } .rem .dim { color: var(--fg3); }
.rem .rx { margin-left: auto; width: 20px; height: 20px; display: grid; place-items: center; border-radius: var(--r-rx); background: var(--eyeHover); color: var(--fg2); font-size: 10px; }
/* Skeleton */
.skel { width: 200px; padding: 16px; background: var(--bg1); border: 1px solid var(--hair); border-radius: 12px; }
.skel i { display: block; height: 10px; margin-bottom: 9px; background: var(--hair2); border-radius: var(--r-skel); }
.skel p { margin: 4px 0 0; font-size: 11.5px; color: var(--fg2); line-height: 1.45; }
/* round 2 */
.cal .eye svg, .rem .rx svg { display: block; }
.side.ctx { width: 230px; padding: 6px 10px; }
.cal.off { color: var(--fg3); } .cal.off .cb { opacity: .55; }
.desk.eye-even2 .cal { padding-right: 2px; }
.desk.eyes-plain .cal .eye.hot { background: none; color: var(--fg); }
.desk.eyes-none .cal .eye { display: none; }
.desk.eyes-none .cal.off .cb { background: none !important; box-shadow: inset 0 0 0 1.5px var(--fg3); opacity: 1; }
.desk.rx-even4 .rem { padding-right: 4px; } .desk.rx-even4 .rem .rx { border-radius: 4px; }
.desk.rx-big24 .rem { padding-right: 2px; } .desk.rx-big24 .rem .rx { width: 24px; height: 24px; border-radius: 6px; }
</style>
</head>
<body>
<div id="root"><div id="stage"><div class="desk" id="desk"></div></div><aside id="picker"></aside></div>
<script>
// ================= edit for each round =================
const PRODUCT = 'Horion', VERSION = 'v12', ROUND = 2;
const DESK = { w: 1440, h: 900 };
const SCENES = [['today', 'Today numbers'], ['more', '"+N" and "more"'], ['menus', 'Menus and lists'], ['inrow', 'Buttons inside rows'], ['skel', 'Loading sidebar'], ['eyectx', 'Eye in context'], ['all', 'All spots']];
const HOWTO = ['Each tile shows one corner at 3× and at real size.', 'Hover an option to see it; click to pick.', 'Ink / Paper (left) switches the theme.', 'Scale: 4 events and chips · 8 controls · 12 surfaces · 6 = a row inside a 12 surface with 6 padding.'];
const READ = 'Quiet tool UI: corners come from one scale (4 / 8 / 12), nested shapes stay concentric. Dials: variance 2, motion 2, density 7.';
const LOCKED = { hdr: '6', mon: '6', pn: '4', adm: '4', mm: '4', sk: '8', menu: '6', pal: '6', undo: '6', eye: '6', rx: '6', skel: '4' };
const BEFORE = {};
const FB = 'show me everywhere where this would make a difference … let me decide where its best';
const P = (v, l, h) => [v, l, h];
const FB2 = 'padding around the btn looks weird';
const DECISIONS = [
  { id: 'rxpad', name: 'Space around ✕ on a reminder row', fb: FB2, note: 'Hovered reminder row. Now: 4 pt above and below the ✕, 8 pt to its right.', scene: 'inrow', hl: '[data-k="rx"]', opts: [
    P('even4', 'Even 4 pt all round, 4 pt corners', 'Row trailing padding 8 → 4. The ✕ stays 20 pt; 8 − 4 = 4 pt corners, so it is concentric with the row.'),
    P('big24', 'Bigger ✕ (24 pt), even 2 pt, 6 pt corners', 'The ✕ grows to 24 pt and sits 2 pt from the row edge on three sides; 8 − 2 = 6 pt corners.'),
    P('now', 'As now (4 pt above, 8 pt right, 6 pt corners)', 'Round 1 pick with today’s spacing.')] },
  { id: 'eyepad', name: 'Space around the eye in a sidebar row', fb: 'here as well', note: 'Hovered calendar row. Now: 2 pt above and below the eye, 4 pt to its right.', scene: 'inrow', hl: '[data-k="eye"]', opts: [
    P('even2', 'Even 2 pt all round, 6 pt corners', 'Row trailing padding 4 → 2. 8 − 2 = 6 pt corners, concentric with the row.'),
    P('now', 'As now (2 pt above, 4 pt right)', 'Round 1 pick with today’s spacing.')] },
  { id: 'eyestyle', name: 'Eye button look', fb: 'im not sure if i like it. but i gotta see it in the grand context', note: 'See "Eye in context": the real sidebar, then the options.', scene: 'eyectx', hl: '[data-k="eyectx"]', opts: [
    P('box', 'Box behind the eye on hover (now)', 'Hovering the row shows the eye; hovering the eye adds a 6 pt box behind it.'),
    P('plain', 'No box, the eye brightens', 'Hovering the eye only turns it from grey to white. Nothing to align.'),
    P('none', 'No eye; click the colour square to hide', 'The square becomes the toggle (hollow when hidden). The row loses the button.')] },
  { g: 'Round 1', lock: true, id: 'hdr', name: 'Today number, week header', fb: FB, note: 'Week and day view header: "Sun 4".', scene: 'today', hl: '[data-k="hdr"]', opts: [
    P('4', '4 pt square-ish, like events', 'Same 4 pt as event blocks and all-day chips. Matches mockup-v11.'), P('6', '6 pt, softer', 'Between the event and control radii.'), P('pill', 'Pill (now)', 'Fully round ends, as the app draws it today.')] },
  { g: 'Round 1', lock: true, id: 'mon', name: 'Today number, month view', fb: FB, note: 'Month cell number; the hover on other days uses the same shape.', scene: 'today', hl: '[data-k="mon"]', opts: [
    P('4', '4 pt, like the week header', 'Same shape as the week header number.'), P('6', '6 pt', 'A little rounder.'), P('pill', 'Pill (now, 11 pt)', 'A 22 pt circle for one digit, as the app draws it today.')] },
  { g: 'Round 1', lock: true, id: 'pn', name: '"+N" button on crowded events', fb: FB, note: 'Time grid: the "+2" over an overlap group. It is a 16 pt chip.', scene: 'more', hl: '[data-k="pn"]', opts: [
    P('4', '4 pt, like the events under it', 'Reads as a small chip of the same family as the events.'), P('pill', 'Pill (now)', 'Round ends; reads as a badge, not a chip.'), P('6', '6 pt', 'Almost a pill at 16 pt high.')] },
  { g: 'Round 1', lock: true, id: 'adm', name: '"+N more" hover, all-day row', fb: FB, note: 'Hovered, next to the all-day chips.', scene: 'more', hl: '[data-k="adm"]', opts: [
    P('4', '4 pt, same as the chips above', 'The hover has the same corners as the chips it lines up with.'), P('8', '8 pt (now)', 'Control radius; rounder than its neighbours.')] },
  { g: 'Round 1', lock: true, id: 'mm', name: '"N more" hover, month cell', fb: FB, note: 'Hovered, under the month event lines.', scene: 'more', hl: '[data-k="mm"]', opts: [
    P('4', '4 pt, same as the event lines', 'Matches the month event lines above it.'), P('5', '5 pt (now)', 'A one-off value, not on the scale.'), P('8', '8 pt', 'Control radius.')] },
  { g: 'Round 1', lock: true, id: 'sk', name: 'Events in the "+N" stack panel', fb: FB, note: 'Panel is 12 pt with 4 pt padding, so 8 pt rows are concentric.', scene: 'menus', hl: '[data-k="sk"]', opts: [

  const a = t.dataset.a;
  if (t.dataset.scene) return preset(t.dataset.scene);
  if (t.dataset.d) { clearTimeout(PT); PV = null; S.c[t.dataset.d] = t.dataset.v; S.before = false; }
  else if (a === 'before' || a === 'after') S.before = a === 'before';
  else if (a === 'hover') S.hover = S.hover === false;
  else if (a === 'guides') S.guides = !S.guides;
  else if (a === 'agt') { S.agt = S.agt === false; save(); window.AGT?.set(S.agt, true); }
  else if (a === 'unlock') S.unlock = !S.unlock;
  else if (a === 'copy') { navigator.clipboard?.writeText(picksText()); t.textContent = 'Copied'; return; }
  else if (a === 'reset') { DECISIONS.forEach(d => { S.c[d.id] = d.lock ? LOCKED[d.id] : d.opts[0][0]; }); S.before = false; }
  else if (a === 'demo') A = fresh();
  else return;
  save(); renderPicker();
});
// Hover intent: show an option after 90 ms. The gaps inside one decision keep the preview, so nothing flickers.
let PT = null;
picker.addEventListener('mouseover', ev => {
  const o = ev.target.closest('.pk-opt[data-d]'), blk = ev.target.closest('.pk-dec');
  clearTimeout(PT);
  if (o) PT = setTimeout(() => previewOn(o.dataset.d, o.dataset.v), 90);
  else if (PV && blk && blk.querySelector(`[data-d="${PV.id}"]`)) return;
  else if (PV) PT = setTimeout(() => previewOff(), 140);
});
picker.addEventListener('mouseleave', () => { clearTimeout(PT); previewOff(); });
desk.addEventListener('click', ev => { const t = ev.target.closest('button'); if (t && appClick(t)) { save(); renderPicker(); } });
document.addEventListener('keydown', ev => {
  if (ev.target.closest?.('input, textarea') || ev.metaKey || ev.ctrlKey) return;
  if (ev.key === 'g' || ev.key === 'G') { S.guides = !S.guides; save(); renderPicker(); }
  else if ((ev.key === 'b' || ev.key === 'B') && Object.keys(BEFORE).length) { S.before = !S.before; save(); renderPicker(); }
});
window.addEventListener('resize', () => { fit(); drawGuides(); });
window.addEventListener('hashchange', () => { const id = location.hash.slice(1).split('&')[0]; if (id) preset(id); });
fit();
const scene0 = location.hash.slice(1).split('&')[0];
if (scene0 && SCENES.some(s => s[0] === scene0)) preset(scene0); else renderPicker();
document.fonts?.ready.then(() => { fit(); drawGuides(); });
</script>
<div id="agentation"></div>
<script type="module">
// Agentation (agentation.com): click any element, write a note. The picker toggle turns it on and off.
// It loads from esm.sh, so it needs the network. The mockup works without it. Its notes go into "Copy my picks".
const deps = '?deps=react@18.3.1,react-dom@18.3.1';
let lib = null, root = null;
async function set(on, open) {
  if (!on) { root?.unmount(); root = null; agtMsg('Off.'); return; }
  if (root) return;
  agtMsg('Loading from esm.sh …');
  try {
    lib = lib || await Promise.all([import('https://esm.sh/react@18.3.1'), import('https://esm.sh/react-dom@18.3.1/client' + deps), import('https://esm.sh/agentation@3.1.2' + deps)]);
    const [React, { createRoot }, { Agentation }] = lib;
    root = createRoot(document.getElementById('agentation'));
    root.render(React.createElement(Agentation, {
      appName: `${PRODUCT} ${VERSION} round ${ROUND}`, className: 'agt-host',
      identifyingAttributes: ['data-area', 'data-k', 'data-d', 'data-v', 'data-go', 'data-open'],
      onAnnotationAdd: NOTES.set, onAnnotationUpdate: NOTES.set, onAnnotationDelete: NOTES.del, onAnnotationsClear: NOTES.clear,
    }));
    agtMsg('On. ⌘⇧F or the button at the bottom right of the app opens it. Then click an element and write.');
    // After a click on the toggle, open the toolbar at once.
    if (open) setTimeout(() => document.dispatchEvent(new KeyboardEvent('keydown', { key: 'F', code: 'KeyF', metaKey: true, shiftKey: true, bubbles: true })), 250);
  } catch (e) { root = null; agtMsg('Did not load (no network?). The mockup works without it.'); console.info('Agentation did not load.', e); }
}
window.AGT = { set };
if (!shot) set(S.agt !== false); else agtMsg('');
</script>
